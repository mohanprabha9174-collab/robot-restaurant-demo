<style>
/* Layout: one screen at a time, landscape tablet first. Shop = menu board, rules = order tickets on a kitchen rail, results = a day receipt.
   Single bright theme on purpose (a kids' game); every color is set explicitly. */
:root {
  --ink: #25172F;          /* aubergine text */
  --ink-2: #57466A;        /* secondary text, 7:1 on cream */
  --cream: #FBF3E6;        /* page */
  --paper: #FFFDF8;        /* cards */
  --line: #E4D6C3;
  --plum: #5B3BA6;         /* IF blocks */
  --plum-deep: #3F2780;
  --plum-soft: #ECE6FB;
  --tomato: #EF6A45;       /* THEN blocks (ink text on top) */
  --tomato-deep: #BE3E1F;
  --tomato-soft: #FDE6DC;
  --sun: #FFC94A;          /* coins + stars */
  --good: #1E7A4F;
  --good-soft: #DDF3E7;
  --bad: #B3283F;
  --bad-soft: #FBE1E5;
  --focus: #1C6FD8;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
  --tap: 48px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 400 18px/1.4 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); line-height: 1.05; margin: 0; text-wrap: balance; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.ico { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ico .fill-sun { fill: var(--sun); stroke: #B9861F; }
.ico .fill-cur { fill: currentColor; stroke: none; }
.ico .nofill { fill: none; stroke: #B9861F; }
.ico .dot { stroke-width: 3.4; }

#app { min-height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ink); color: var(--cream);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; white-space: nowrap; }
.brand .ico { width: 30px; height: 30px; color: var(--sun); }
.steps { display: flex; gap: 6px; margin: 0 auto; padding: 0; list-style: none; }
.steps li { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: #B9ACCB; padding: 6px 12px; border-radius: 999px; }
.steps li b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #3B2B4D; font-size: 13px; }
.steps li[aria-current="step"] { background: var(--sun); color: var(--ink); }
.steps li[aria-current="step"] b { background: var(--ink); color: var(--sun); }
.steps li.done b { background: #8F91F5; color: var(--ink); }
.tb-btn {
  min-width: var(--tap); min-height: var(--tap); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 14px; border-radius: 14px; border: 2px solid #4D3B62; background: transparent; color: var(--cream); cursor: pointer; font-weight: 700; font-size: 15px;
}
.tb-btn:hover { background: #3A2A4C; }
.tb-btn[aria-pressed="true"] { background: var(--sun); color: var(--ink); border-color: var(--sun); }

/* ---------- generic ---------- */
.screen { flex: 1; display: flex; flex-direction: column; padding-block: 18px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 16px; max-width: 1360px; width: 100%; margin: 0 auto; }
.screen-enter { animation: screen-enter .24s ease-out; }
@keyframes screen-enter {
  from { opacity: .35; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.screen-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.screen-head h1 { font-size: clamp(30px, 3.4vw, 42px); font-weight: 800; }
.screen-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 60ch; }
.btn {
  min-height: 56px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 0 26px; border-radius: 999px; border: 0; cursor: pointer;
  font: 800 21px/1 var(--display); letter-spacing: .01em; transition: transform .12s ease, box-shadow .12s ease;
}
.btn:active { transform: translateY(2px); }
.btn-go { background: var(--tomato); color: var(--ink); box-shadow: 0 5px 0 var(--tomato-deep); }
.btn-go:active { box-shadow: 0 3px 0 var(--tomato-deep); }
.btn-plum { background: var(--plum); color: #fff; box-shadow: 0 5px 0 var(--plum-deep); }
.btn-quiet { background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn-small { min-height: var(--tap); font-size: 17px; padding: 0 18px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.bottombar {
  position: sticky; bottom: 0; z-index: 5; margin-top: auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--cream) 75%, rgba(251,243,230,0));
}
.coins { display: inline-flex; align-items: center; gap: 10px; font: 800 22px/1 var(--display); }
.coin-row { display: flex; gap: 4px; flex-wrap: wrap; }
.coin-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--sun); border: 2.5px solid #B9861F; }
.coin-dot.spent { background: transparent; border: 2.5px dashed #C9B9A3; }

/* ---------- welcome ---------- */
.welcome { max-width: 1190px; justify-content: center; padding-block: 28px max(34px, env(safe-area-inset-bottom, 0px)); gap: 22px; }
.welcome-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.welcome .kicker {
  display: inline-flex; align-items: center; gap: 8px; margin: 0;
  color: var(--plum-deep); font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
}
.welcome-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .92fr); gap: clamp(24px, 5vw, 66px); align-items: center; }
.welcome-copy { display: grid; gap: 16px; justify-items: start; }
.welcome h1 { font-size: clamp(44px, 6.6vw, 84px); font-weight: 800; letter-spacing: -.045em; }
.welcome h1 .title-intro { display: block; margin-bottom: 8px; color: var(--plum); font-size: .37em; letter-spacing: -.015em; }
.welcome h1 .title-accent { display: block; color: var(--tomato-deep); }
.welcome-title-drop { animation: welcome-drop .72s ease-out both; }
@keyframes welcome-drop {
  0% { opacity: 0; transform: translateY(-72px); }
  60% { opacity: 1; transform: translateY(8px); }
  81% { transform: translateY(-4px); }
  100% { opacity: 1; transform: translateY(0); }
}
.welcome .lede { margin: 0; color: var(--ink-2); font-size: clamp(17px, 2vw, 21px); font-weight: 700; }
.mode-picker { width: 100%; margin-top: 6px; }
.mode-picker h2 { margin-bottom: 12px; font-size: clamp(20px, 2.4vw, 27px); text-wrap: initial; }
.mode-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode-card {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 9px;
  min-height: 84px; padding: 11px; border: 2px solid var(--ink); border-radius: 15px;
  background: var(--sun); color: var(--ink); box-shadow: 0 4px 0 var(--ink);
  text-align: left; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
}
.mode-card.challenge { background: var(--plum-soft); color: var(--plum-deep); }
.mode-card:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
.mode-card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.mode-name { display: block; font: 800 clamp(17px, 1.8vw, 22px)/1.1 var(--display); }
.mode-detail { display: block; margin-top: 4px; font-size: 13px; font-weight: 700; }
.welcome-art {
  margin: 0; padding: 12px; border: 2px solid var(--ink); border-radius: 22px;
  background: var(--ink); color: var(--cream); box-shadow: 0 6px 0 #DDCDB7;
}
.welcome-art .scene-box { border: 0; border-radius: 12px; }
.welcome-art figcaption { margin: 11px 2px 2px; text-align: center; font-size: 15px; font-weight: 700; }

.scene-box { position: relative; border-radius: var(--r); overflow: hidden; border: 3px solid var(--ink); background: #FFF1DC; }
.scene { display: block; width: 100%; height: auto; }
.scene .sc-sign { font: 800 16px var(--display); fill: var(--sun); letter-spacing: .2em; }
.scene .sc-menu-h { font: 800 18px var(--display); fill: var(--sun); letter-spacing: .2em; }
.scene .sc-menu { font: 700 14px var(--body); fill: #F3E7D3; }
.scene .shadow { fill: #25172F; opacity: .12; }
.robot .r-head { fill: #8F91F5; stroke: var(--ink); stroke-width: 4; }
.robot .r-face { fill: #F4F2FF; stroke: var(--ink); stroke-width: 3; }
.robot .r-eye { fill: var(--ink); }
.robot .r-glint { fill: #fff; }
.robot .r-line { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
.robot .r-cheek { fill: #F59A86; opacity: .7; }
.robot .r-stem { stroke: var(--ink); stroke-width: 4; }
.robot .r-bulb { fill: var(--tomato); stroke: var(--ink); stroke-width: 3; }
.robot .r-body { fill: #A7A9FA; stroke: var(--ink); stroke-width: 4; }
.robot .r-bowtie { fill: var(--tomato); stroke: var(--ink); stroke-width: 3; }
.robot .r-button { fill: var(--sun); stroke: var(--ink); stroke-width: 3; }
.robot .r-arm { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; }
.robot .r-tray { fill: #D8DAE6; stroke: var(--ink); stroke-width: 3; }
.robot .r-neck { fill: #6E70D6; stroke: var(--ink); stroke-width: 3; }
.robot .r-wheel { fill: #3B2B4D; stroke: var(--ink); stroke-width: 3; }
.robot .r-hub { fill: var(--sun); }
.robot .r-held-bg { fill: #fff; stroke: var(--ink); stroke-width: 3; }
.robot .r-held-ico { fill: none; stroke: var(--tomato-deep); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.robot .r-held-ico .fill-sun { fill: var(--sun); }
.robot .r-held-ico .dot { stroke-width: 3.4; }
.r-arm-right { transform-origin: 38px 30px; transform-box: view-box; }
.r-wave { animation: wave 1.4s ease-in-out infinite; }
@keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
.person .c-eye { fill: var(--ink); }
.person .c-line { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.person .c-mouth { fill: #7E2633; }
.person .c-cheek { fill: #E86A6A; opacity: .35; }
.person .c-tear { fill: #5DB7E8; }
.up { transform-box: fill-box; transform-origin: 50% 100%; }
.up.fresh { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
.heat { animation: shimmer 1.6s ease-in-out infinite; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes shimmer { 50% { transform: translateY(-4px); opacity: .6; } }

/* ---------- budget ---------- */
.budget-grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 20px; align-items: start; }
.purse {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  background: var(--ink); color: var(--cream); padding: 14px 18px; border-radius: var(--r); margin-bottom: 14px;
}
.purse .big { font: 800 44px/1 var(--display); color: var(--sun); font-variant-numeric: tabular-nums; }
.purse .lbl { font-size: 15px; font-weight: 700; color: #CFC3DD; }
.purse .coin-dot.spent { border-color: #6A5A7E; }
.starter { margin: 12px 0 0; font-size: 16px; color: var(--ink-2); }
.starter b { color: var(--ink); }
.shop { background: #2F2440; color: var(--cream); border-radius: var(--r); padding: 16px; }
.shop h2 { font-size: 28px; color: var(--sun); letter-spacing: .02em; }
.shop > p { margin: 4px 0 12px; color: #E6DCF0; font-size: 17px; }
.shop-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; list-style: none; margin: 0; padding: 0; }
.item {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 12px; align-items: start;
  background: var(--paper); color: var(--ink); border-radius: 14px; padding: 12px; border: 3px solid transparent;
}
.item.owned { border-color: var(--sun); background: #FFF6DA; }
.item .art { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--plum-soft); color: var(--plum); grid-row: span 2; }
.item .art .ico { width: 34px; height: 34px; }
.item.owned .art { background: var(--sun); color: var(--ink); }
.item h3 { font: 800 19px/1.1 var(--display); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.price { display: inline-flex; align-items: center; gap: 3px; font: 800 18px/1 var(--display); white-space: nowrap; }
.price .ico { width: 20px; height: 20px; }
.item p { margin: 0; font-size: 15px; color: var(--ink-2); line-height: 1.3; }
.item .act { grid-column: 1 / -1; margin-top: 8px; }
.buy {
  width: 100%; min-height: var(--tap); border-radius: 12px; border: 0; cursor: pointer; font: 800 18px/1 var(--display);
  background: var(--plum); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.buy.remove { background: transparent; color: var(--ink); border: 2.5px solid var(--ink); }
.buy[aria-disabled="true"] { background: #EDE6DC; color: var(--ink-2); cursor: not-allowed; }
.badge-owned { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--good); }

/* ---------- code / blocks ---------- */
.code-grid { display: grid; grid-template-columns: minmax(320px, 390px) minmax(0, 1fr); gap: 18px; align-items: start; }
.code-grid.hb-open { grid-template-columns: minmax(280px, 330px) minmax(0, 1fr) minmax(300px, 360px); }
.palette { background: var(--paper); border: 2.5px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.palette h2 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.palette .hint { margin: -4px 0 0; font-size: 14px; color: var(--ink-2); }
.blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.block {
  position: relative; display: flex; align-items: center; gap: 8px; min-height: 56px; width: 100%;
  padding: 8px 10px 8px 12px; border: 0; cursor: grab; text-align: left; touch-action: none; user-select: none; -webkit-user-select: none;
  font: 700 16px/1.15 var(--body);
}
.block .kw { font: 800 12px/1 var(--display); letter-spacing: .08em; padding: 4px 6px; border-radius: 6px; flex: none; }
.block .ico { width: 24px; height: 24px; }
.block .txt { min-width: 0; }
.palette .block > .ico { display: none; }
.palette .block { font-size: 15.5px; gap: 4px; padding-block: 5px; }
.palette .block .kw { display: none; }
.palette .block .txt { flex: 1; overflow-wrap: anywhere; }
.block-grip {
  flex: none; display: grid; place-items: center; width: 44px; height: 44px;
  margin-inline-end: -4px; border-radius: 8px; cursor: grab; touch-action: none;
  background: rgb(255 255 255 / .2);
}
.block-grip::before {
  content: ""; width: 12px; height: 18px;
  background: radial-gradient(circle, currentColor 1.4px, transparent 1.7px) 0 0 / 6px 6px;
}
.ghost .block-grip { display: none; }
.block .req { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; margin-top: 2px; }
.block .req .ico { width: 14px; height: 14px; }
/* IF blocks: puzzle tab on the right */
.b-if { background: var(--plum); color: #fff; border-radius: 12px 6px 6px 12px; box-shadow: 0 4px 0 var(--plum-deep); margin-right: 10px; width: calc(100% - 10px); }
.b-if::after { content: ""; position: absolute; right: -10px; top: 50%; width: 20px; height: 22px; margin-top: -11px; border-radius: 0 11px 11px 0; background: var(--plum); }
.b-if .kw { background: #fff; color: var(--plum); }
/* THEN blocks: notch on the left, arrow tip on the right */
.b-then { background: var(--tomato); color: var(--ink); border-radius: 6px 12px 12px 6px; box-shadow: 0 4px 0 var(--tomato-deep);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 0 62%, 9px 50%, 0 38%); padding-left: 18px; padding-right: 18px; }
.b-then .kw { background: var(--ink); color: var(--tomato); }
.b-then.locked { background: #F6C9B9; box-shadow: 0 4px 0 #D9A08D; }
.block.armed { outline: 4px solid var(--sun); outline-offset: 3px; animation: bob .9s ease-in-out infinite; }
.b-then.armed { filter: drop-shadow(0 0 0 var(--sun)) drop-shadow(0 0 4px var(--sun)); outline: none; }
@keyframes bob { 50% { transform: translateY(-3px); } }

.armbar { display: flex; align-items: center; gap: 12px; background: var(--sun); border-radius: 14px; padding: 8px 8px 8px 16px; font-weight: 700; }
.armbar .btn-small { margin-left: auto; min-height: 44px; }
.code-hint { display: flex; align-items: center; gap: 10px; background: var(--plum-soft); border-radius: 14px; padding: 10px 14px; font-size: 16px; }
.code-hint .ico { color: var(--plum); width: 28px; height: 28px; }

.rail { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rail-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rail-top h2 { font-size: 24px; }
.rail-bar { height: 10px; border-radius: 5px; background: linear-gradient(#C9B9A3, #A8957C); }
.ticket {
  background: var(--paper); border-radius: 6px 6px 14px 14px; border: 2.5px solid var(--line); border-top: 0;
  box-shadow: 0 3px 0 var(--line); padding: 10px 12px 12px; position: relative;
  background-image: radial-gradient(circle at 10px 0, transparent 6px, var(--paper) 6.5px); background-size: 20px 12px; background-repeat: repeat-x; background-position: top;
}
.ticket.drop-hot { border-color: var(--sun); }
.t-head { display: flex; align-items: center; gap: 8px; }
.t-num { font: 800 20px/1 var(--display); display: flex; align-items: center; gap: 8px; }
.t-num b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--sun); }
.t-tools { margin-left: auto; display: flex; gap: 6px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 2px solid var(--line); background: var(--cream); cursor: pointer; color: var(--ink); padding: 0; }
.icon-btn .ico { width: 22px; height: 22px; }
.icon-btn:hover { border-color: var(--ink-2); }
.icon-btn[disabled] { opacity: .35; cursor: default; }
.t-body { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 8px; }
.t-arrow { color: var(--ink-2); }
.t-arrow .ico { width: 28px; height: 28px; }
.zone {
  min-height: 64px; width: 100%; border-radius: 12px; border: 3px dashed #CDBBA4; background: #FBF6EE;
  display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; cursor: pointer; text-align: center; position: relative;
  font-size: 15px; font-weight: 700; color: var(--ink-2);
}
.zone .zl { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.zone .zl small { font-weight: 400; font-size: 13px; }
.zone.z-if .zk { color: var(--plum); font: 800 15px/1 var(--display); letter-spacing: .06em; }
.zone.z-then .zk { color: var(--tomato-deep); font: 800 15px/1 var(--display); letter-spacing: .06em; }
.zone.filled { border: 0; background: transparent; padding: 0; }
.zone.filled .block { cursor: pointer; flex: 1; }
.zone.target { border-color: var(--sun); background: #FFF6D6; border-style: solid; animation: glow 1s ease-in-out infinite; }
.zone.filled.target { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 12px; }
.zone.over { background: #FFE79A; }
@keyframes glow { 50% { box-shadow: 0 0 0 5px rgba(255, 201, 74, .45); } }
.clear-x { position: absolute; top: -10px; right: -6px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); display: grid; place-items: center; padding: 0; cursor: pointer; z-index: 2; }
.clear-x::before { content: ""; position: absolute; inset: -8px; }
.clear-x .ico { width: 16px; height: 16px; }
.notes { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.note { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; padding: 6px 10px; border-radius: 10px; flex-wrap: wrap; }
.note .ico { width: 20px; height: 20px; }
.note.warn { background: var(--tomato-soft); color: #8A2A14; }
.note.info { background: var(--plum-soft); color: var(--plum-deep); }
.note .link { margin-left: auto; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 2px solid currentColor; background: var(--paper); cursor: pointer; font-weight: 800; font-size: 14px; color: inherit; }

.ghost { position: fixed; z-index: 100; pointer-events: none; width: 190px; opacity: .92; transform: translate(-50%, -50%) rotate(-3deg); }
body.dragging, body.dragging * { cursor: grabbing !important; }

/* handbook */
.bs { display: none; }
.hb-btn { background: var(--plum); color: #fff; box-shadow: 0 5px 0 var(--plum-deep); }
.hb-tab {
  position: fixed; right: env(safe-area-inset-right, 0px); top: 46%; z-index: 20; writing-mode: vertical-rl; transform: rotate(180deg);
  min-width: 52px; padding: 18px 10px; border-radius: 0 16px 16px 0; border: 0; background: var(--plum); color: #fff; cursor: pointer;
  font: 800 18px/1 var(--display); letter-spacing: .04em; display: flex; align-items: center; gap: 10px; box-shadow: -3px 0 0 var(--plum-deep);
}
.hb-tab .ico { transform: rotate(90deg); }
.handbook { background: var(--paper); border: 3px solid var(--plum); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 150px); overflow: auto; }
.handbook-head { display: flex; align-items: flex-start; gap: 10px; }
.handbook h2 { font-size: 22px; color: var(--plum-deep); }
.handbook-head .btn-small { margin-left: auto; flex: none; }
.handbook .lead { margin: 0; font-size: 16px; }
.hb-entry { border-top: 2px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.hb-quote { display: flex; align-items: center; gap: 10px; font: 800 18px/1.15 var(--display); }
.hb-quote svg.face { width: 44px; height: 44px; flex: none; }
.hb-entry p { margin: 0; font-size: 15px; color: var(--ink-2); }
.hb-sample { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mini { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 8px; font-weight: 700; font-size: 14px; }
.mini .kw { font: 800 11px/1 var(--display); letter-spacing: .08em; }
.mini.m-if { background: var(--plum); color: #fff; }
.mini.m-then { background: var(--tomato); color: var(--ink); }
.upbadge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.upbadge .ico { width: 15px; height: 15px; }
.upbadge.have { background: var(--good-soft); color: var(--good); }
.upbadge.need { background: var(--tomato-soft); color: #8A2A14; }
.older { background: var(--plum-soft); padding: 10px 12px; border-radius: 12px; font-size: 15px; }

/* ---------- simulation ---------- */
.sim-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(290px, 3fr); gap: 18px; align-items: start; }
.sim-stage { position: relative; }
.bubble {
  position: absolute; max-width: 46%; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 14px;
  font: 800 clamp(16px, 1.8vw, 22px)/1.15 var(--display); transition: opacity .35s ease, transform .35s ease;
}
.bubble::after { content: ""; position: absolute; bottom: -14px; width: 22px; height: 22px; background: var(--paper); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg) skew(10deg, 10deg); }
.bubble.cust { right: 3%; top: 4%; max-width: 44%; }
.bubble.cust::after { right: 18%; }
.bubble.bot { left: 3%; top: 38%; max-width: 40%; background: #F4F2FF; }
.bubble.bot::after { left: auto; right: -14px; bottom: auto; top: 40%; background: #F4F2FF; transform: rotate(-45deg) skew(10deg, 10deg); }
.bubble .who { display: block; font: 700 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
.robot-wrap { transition: transform .7s cubic-bezier(.4, 1.4, .5, 1); }
[data-phase="0"] .p1, [data-phase="0"] .p2, [data-phase="0"] .p3, [data-phase="1"] .p2, [data-phase="1"] .p3, [data-phase="2"] .p3 { visibility: hidden; }
[data-phase="1"] .p1, [data-phase="2"] .p2, [data-phase="3"] .p3 { animation: rise .4s ease-out both; }
[data-phase="0"] .bubble.cust { animation: rise .4s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.panel { background: var(--paper); border: 2.5px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.meter { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.meter .lbl { font-weight: 700; color: var(--ink-2); font-size: 15px; }
.meter .num { font: 800 46px/1 var(--display); font-variant-numeric: tabular-nums; }
.stars { display: flex; flex-wrap: wrap; gap: 2px; max-width: 260px; }
.stars .ico { width: 22px; height: 22px; }
.stars .ico.off { opacity: .2; filter: grayscale(1); }
.cust-count { display: flex; gap: 6px; align-items: center; font-weight: 700; }
.cust-count i { width: 30px; height: 10px; border-radius: 5px; background: var(--line); display: block; }
.cust-count i.on { background: var(--ink); }
.cust-count i.good { background: var(--good); }
.cust-count i.bad { background: var(--bad); }
.matched { border-radius: 14px; padding: 10px 12px; background: var(--cream); }
.matched .lbl { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin-bottom: 6px; }
.matched .rule-line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.matched.none .rule-line { font: 800 19px/1.2 var(--display); }
.result { border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.result .delta { font: 800 38px/1 var(--display); grid-row: span 2; min-width: 64px; text-align: center; }
.result h3 { font-size: 22px; }
.result p { margin: 0; font-size: 16px; }
.result.good { background: var(--good-soft); color: #0F4D30; }
.result.partial { background: #FFF0C7; color: #563708; }
.result.bad { background: var(--bad-soft); color: #7A1428; }
.scoreline { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 17px; }
.sim-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sim-controls .btn-go { flex: 1; }

/* ---------- results (receipt) ---------- */
.results-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start; }
.receipt {
  background: var(--paper); padding: 22px 22px 30px; border-radius: 4px; box-shadow: 0 6px 0 var(--line);
  font-variant-numeric: tabular-nums; position: relative;
  -webkit-mask: radial-gradient(10px at 50% 100%, transparent 98%, #000) 50% 100% / 20px 100% repeat-x;
          mask: radial-gradient(10px at 50% 100%, transparent 98%, #000) 50% 100% / 20px 100% repeat-x;
}
.receipt .rhead { text-align: center; border-bottom: 2px dashed var(--line); padding-bottom: 12px; margin-bottom: 10px; }
.receipt .rhead small { display: block; letter-spacing: .14em; font-weight: 700; font-size: 13px; color: var(--ink-2); }
.receipt .final { font: 800 64px/1 var(--display); color: var(--tomato-deep); }
.receipt h1 { font-size: 26px; margin-top: 4px; }
.rline { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dotted var(--line); font-size: 17px; }
.rline b { font-family: var(--display); font-size: 20px; }
.rlog { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.rlog li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 15px; }
.rlog .n { font: 800 15px/1 var(--display); width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--cream); }
.rlog .d { font: 800 18px/1 var(--display); }
.rlog .d.good { color: var(--good); }
.rlog .d.bad { color: var(--bad); }
.ideas { display: flex; flex-direction: column; gap: 12px; }
.ideas h2 { font-size: 28px; }
.idea { background: var(--paper); border-radius: var(--r); border: 2.5px solid var(--line); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
.idea .ico { width: 30px; height: 30px; color: var(--plum); margin-top: 2px; }
.idea p { margin: 0 0 8px; font-size: 18px; }
.idea.win { border-color: var(--good); background: var(--good-soft); }
.idea.win .ico { color: var(--good); }
.end-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(37, 23, 47, .55); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--paper); border-radius: 22px; border: 3px solid var(--ink); padding: 20px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.modal h2 { font-size: 28px; }
.modal p { margin: 0; }
.modal ul { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.modal .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.modal .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

.err { margin: 40px auto; max-width: 520px; text-align: center; display: grid; gap: 12px; }

/* Chef's Challenge */
.challenge-status { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.challenge-status b { padding: 7px 12px; border-radius: 999px; background: var(--plum-soft); color: var(--plum-deep); }
.challenge-board { margin-top: 14px; padding: 15px; border: 2px solid var(--line); border-radius: 16px; background: var(--paper); }
.challenge-investments {
  padding: clamp(14px, 3vw, 26px); border: 2px solid var(--ink); border-radius: 22px;
  background: var(--ink); color: var(--cream);
}
.invest-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.invest-header > .coins { padding: 8px 11px; border-radius: 12px; background: #4A3560; color: var(--sun); font-size: 17px; }
.challenge-investments h2, .challenge-board h2 { font-size: 24px; }
.invest-header p, .challenge-board p { margin: 6px 0 12px; }
.invest-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; }
.invest-choice {
  --policy-tint: #FFF0C7; --policy-ink: #623B00;
  min-width: 0; display: grid; align-content: start; grid-template-rows: auto auto 1fr auto; gap: 8px;
  padding: 14px; border: 2px solid transparent; border-radius: 16px; background: var(--policy-tint); color: var(--ink);
}
.invest-choice.steady { --policy-tint: var(--plum-soft); --policy-ink: var(--plum-deep); }
.invest-choice.safety { --policy-tint: var(--good-soft); --policy-ink: #0F4D30; }
.invest-choice.active { border-color: var(--sun); box-shadow: inset 0 0 0 2px var(--ink); }
.invest-card-top, .invest-card-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.invest-benefit { font: 800 clamp(25px, 3vw, 36px)/1 var(--display); color: var(--policy-ink); }
.invest-active { display: inline-flex; align-items: center; gap: 4px; background: var(--ink); color: #fff; border-radius: 999px; padding: 4px 8px; font-size: 13px; font-weight: 800; }
.invest-choice h3 { font-size: 22px; }
.invest-choice p { margin: 0; font-size: 15px; }
.invest-card-footer { margin-top: 4px; }
.invest-price { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 800; }
.invest-card-footer .btn { padding-inline: 12px; font-size: 16px; }
.invest-card-footer .btn[disabled] { opacity: 1; color: var(--ink-2); border-color: var(--line); box-shadow: none; }
.challenge-guest-result { display: block; }
.challenge-guest-result p { margin-top: 6px; }
.challenge-rules { width: min(720px, 100%); max-height: 88dvh; overflow: auto; }
.loss-scrim { background: var(--ink); }
.challenge-loss {
  align-items: center; text-align: center; padding: clamp(24px, 6vw, 46px);
  background: var(--bad); color: #fff; border-color: #FFF0D8; box-shadow: 0 10px 0 #681725;
  animation: screen-enter .24s ease-out;
}
.challenge-loss h2 { font-size: clamp(48px, 11vw, 90px); text-transform: uppercase; letter-spacing: -.04em; }
.challenge-loss .btn { margin-top: 5px; }
.challenge-rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 10px; }
.challenge-rule-grid section { padding: 12px; background: var(--plum-soft); border-radius: 12px; }
.challenge-rule-grid section:nth-child(2) { background: #FFF0C7; }
.challenge-rule-grid section:nth-child(3) { background: var(--tomato-soft); }
.challenge-rule-grid h3 { font-size: 20px; }
.challenge-rule-grid p { margin: 6px 0 0; }
.vip-portraits { display: flex; gap: 6px; margin: 7px 0; }
.vip-portraits svg { width: 70px; height: 72px; border-radius: 12px; background: var(--paper); }
.nickname { display: grid; gap: 5px; margin: 14px 0; font-weight: 700; }
.nickname input { width: 100%; max-width: 360px; min-height: 48px; padding: 6px 12px; color: var(--ink); border: 2px solid var(--line); border-radius: 10px; font: inherit; }
.nickname small { color: var(--ink-2); font-weight: 400; }
.vip-tag { padding: 4px 9px; border-radius: 999px; color: var(--ink); background: var(--sun); font-weight: 800; }
.guest-requests { margin: 5px 0; padding-left: 21px; }
.guest-requests li { margin: 5px 0; }
.challenge-board ol { padding-left: 27px; }
.challenge-board li { margin: 7px 0; overflow-wrap: anywhere; }

/* ---------- responsive ---------- */
@media (max-width: 820px) {
  .welcome-grid { grid-template-columns: minmax(0, 1fr); max-width: 560px; width: 100%; margin: 0 auto; }
}
@media (max-width: 450px) {
  .mode-options { grid-template-columns: minmax(0, 1fr); }
  .mode-card { min-height: 63px; }
}
@media (max-width: 1279px) {
  .code-grid.hb-open { grid-template-columns: minmax(320px, 390px) minmax(0, 1fr); }
  .handbook.drawer { position: fixed; right: 0; top: 0; bottom: 0; z-index: 30; width: min(400px, 92vw); max-height: none; border-radius: 22px 0 0 22px; border-right: 0;
    padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
    box-shadow: -10px 0 40px rgba(37, 23, 47, .3); }
}
@media (max-width: 980px) {
  .steps li span { display: none; }
  .budget-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .shop-list { grid-template-columns: minmax(0, 1fr); }
  .code-grid, .code-grid.hb-open { grid-template-columns: minmax(250px, 38%) minmax(0, 1fr); }
  .palette { position: sticky; top: 12px; max-height: calc(100dvh - 96px); overflow: auto; }
  .t-body { grid-template-columns: minmax(0, 1fr); }
  .t-arrow { justify-self: center; transform: rotate(90deg); }
}
@media (max-width: 720px) {
  .budget-grid, .results-grid, .sim-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .code-grid, .code-grid.hb-open { grid-template-columns: minmax(0, 1fr); }
  .palette { position: static; max-height: none; overflow: visible; }
}
@media (min-width: 721px) and (max-width: 860px) {
  .palette .blocks { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  body { font-size: 17px; }
  .brand > span { display: none; }
  .steps { display: none; }
  .topbar .tb-btn { padding-inline: 10px; }
  .topbar .tb-btn:first-of-type { margin-left: auto; }
  .welcome-grid { gap: 16px; }
  .sim-stage { display: grid; gap: 8px; }
  .bubble.cust, .bubble.bot { position: static; max-width: none; padding: 8px 10px; font-size: 16px; }
  .bubble::after { display: none; }
  [data-phase="0"] .bubble.bot, [data-phase="1"] .bubble.bot { display: none; }
  .challenge-status { gap: 6px; }
  .challenge-status b { padding: 5px 9px; font-size: 15px; }
  .modal .choices { grid-template-columns: minmax(0, 1fr); }
  .modal { max-height: calc(100dvh - 32px); padding: 14px; }
  .handbook-head { flex-wrap: wrap; }
  .receipt { padding-inline: 14px; }
  .bottombar { gap: 8px; }
  .bottombar .btn { padding: 0 14px; font-size: 17px; min-height: 52px; }
  .bottombar .bl { display: none; }
  .bottombar .hb-btn .bs { display: inline; }
}
@media (max-width: 450px) {
  .invest-list { grid-template-columns: minmax(0, 1fr); }
  .palette { padding: 10px; }
  .palette .block { font-size: 14px; padding-inline-start: 7px; }
  .palette .b-then { padding-inline-start: 13px; padding-inline-end: 13px; }
  .cust-count i { width: 18px; }
  .result .delta { min-width: 40px; font-size: 30px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .bottombar { position: static; }
}
@media (pointer: coarse) {
  .block { cursor: pointer; touch-action: pan-y; }
  .icon-btn { width: 48px; height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

body.colab-visible #app { display:none; }
body:not(.colab-visible) #colab { display:none; }
.colab { --cc-ink:#291F38; --cc-purple:#5638A4; --cc-yellow:#F6C443; --cc-green:#D7EDC7; --cc-blue:#C8E8F3; max-width:1200px; margin:auto; padding:20px 24px 44px; color:var(--cc-ink); }
.colab button { font:700 19px/1.2 var(--body); cursor:pointer; color:inherit; min-height:52px; border:2px solid #D1C4BA; border-radius:15px; background:#FFFCF6; padding:12px 18px; touch-action:manipulation; }
.colab button:focus-visible, .colab summary:focus-visible { outline:4px solid #9469DB; outline-offset:4px; }
.colab button:disabled { cursor:default; opacity:.5; }
.colab .cc-primary { background:var(--cc-purple); border-color:var(--cc-purple); color:white; box-shadow:0 5px 0 #352266; }
.cc-nav { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:25px; flex-wrap:wrap; }
.cc-brand { font:800 23px var(--display); display:flex; align-items:center; gap:8px; }
.cc-brand .ico { color:var(--cc-purple); }
.colab h1 { font:800 clamp(36px,5.5vw,64px)/1.05 var(--display); margin:0 0 18px; letter-spacing:-.035em; }
.colab h2 { font:800 28px/1.15 var(--display); margin:0 0 14px; }
.colab p { margin:0 0 16px; font-size:20px; line-height:1.45; }
.cc-home { display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:40px; padding:20px 0 32px; }
.cc-home .cc-primary { min-width:245px; font-size:24px; margin:14px 0; }
.cc-age { font-weight:800; color:var(--cc-purple); margin-bottom:12px; }
.cc-intro-art { min-height:340px; background:#E9E1F2; border-radius:28px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.cc-intro-art svg { width:90%; max-height:350px; }

.colab .cc-slot.drop-target { outline:4px solid #5638A4; }

.colab .cc-arrow { min-width:0; min-height:84px; font-size:44px; padding:6px; border-color:#5638A4; background:#FFFDF8; touch-action:none; box-shadow:0 4px 0 #C1AFDA; }

 .colab { padding:14px 16px 28px; }

@media print {
 body { background:white!important; }

<script>
/* Robot Restaurant game engine.
 * Pure data + pure functions. No DOM. Loaded by the page (window.RR) and by node tests (module.exports).
 */
(function (root) {
  'use strict';

  var BUDGET = 10;
  var BASE_POPULARITY = 5;
  var MAX_RULES = 4;

  var UPGRADES = [
    { id: 'warming_station', name: 'Food warming station', short: 'Warming station', cost: 3,
      effect: 'Unlocks the robot action "Warm the meal".', unlocks: 'warm' },
    { id: 'replacement_ingredients', name: 'Extra ingredients', short: 'Extra ingredients', cost: 3,
      effect: 'Unlocks the robot action "Remake the meal".', unlocks: 'remake' },
    { id: 'drink_station', name: 'Drink station', short: 'Drink station', cost: 2,
      effect: 'Unlocks the robot action "Bring a drink".', unlocks: 'drink' },
    { id: 'comfort_booth', name: 'Comfy booths', short: 'Comfy booths', cost: 2,
      effect: 'Your restaurant starts the day with +1 popularity.', bonus: 1 },
    { id: 'fun_decor', name: 'Fun decorations', short: 'Fun decorations', cost: 2,
      effect: 'Your restaurant starts the day with +1 popularity.', bonus: 1 },
    { id: 'refund_fund', name: 'Refund fund', short: 'Refund fund', cost: 2,
      effect: 'Unlocks the robot action "Offer a refund".', unlocks: 'refund' }
  ];

  var CONDITIONS = [
    { id: 'cold_food', label: 'Food is cold', says: 'My pizza is cold!', food: 'pizza',
      story: "A customer's pizza was cold", problem: 'the cold pizza' },
    { id: 'wrong_order', label: 'Order is wrong', says: "This isn't what I ordered!", food: 'soup',
      story: 'A customer got the wrong order', problem: 'the wrong order' },
    { id: 'food_not_right', label: "Food isn't right", says: 'My veggie burger is too juicy!', food: 'burger',
      story: 'A customer said their veggie burger was too juicy', problem: 'the too-juicy burger' },
    { id: 'need_drink', label: 'Wants a drink', says: 'Could I have some water?', food: 'water',
      story: 'A customer asked for water', problem: 'the water request' },
    { id: 'praise', label: 'Likes the meal', says: 'This tastes amazing!', food: 'pasta',
      story: 'A customer loved the meal', problem: 'the compliment' }
  ];

  var ACTIONS = [
    { id: 'warm', label: 'Warm the meal', requires: 'warming_station',
      line: "Sorry! We'll warm it up for you.", doing: 'warming the meal', verb: 'warm the meal' },
    { id: 'remake', label: 'Remake the meal', requires: 'replacement_ingredients',
      line: "Sorry! We'll remake it for you.", doing: 'remaking the meal', verb: 'remake the meal' },
    { id: 'drink', label: 'Bring a drink', requires: 'drink_station',
      line: "Of course! Here's a fresh drink.", doing: 'bringing a drink', verb: 'bring a drink' },
    { id: 'refund', label: 'Offer a refund', requires: 'refund_fund',
      line: 'Sorry about that. We can give you a refund.', doing: 'offering a refund', verb: 'offer a refund' },
    { id: 'apologize', label: 'Apologize and tell the kitchen', requires: null,
      line: "I'm sorry! I'll let the kitchen know.", doing: 'telling the kitchen', verb: 'tell the kitchen' },
    { id: 'thank', label: 'Thank the customer', requires: null,
      line: "Thank you! We're glad you enjoyed it.", doing: 'thanking the customer', verb: 'thank the customer' }
  ];

  /* Helpful actions per condition, in the order the coach suggests them. */
  var HELPFUL = {
    cold_food: ['warm', 'remake', 'refund', 'apologize'],
    wrong_order: ['remake', 'refund', 'apologize'],
    food_not_right: ['remake', 'refund', 'apologize'],
    need_drink: ['drink'],
    praise: ['thank']
  };

  /* Why a helpful action helps (shown during the day). */
  var WHY = {
    warm: 'Warm food fixes a cold meal.',
    remake: 'A fresh meal fixes the problem.',
    drink: 'The customer got what they asked for.',
    refund: 'The customer gets their money back, so it feels fair.',
    apologize: 'The kitchen will fix it. Saying sorry and passing it on helps.',
    thank: 'Saying thanks makes a happy customer even happier.'
  };

  var DEFAULT_DAY = ['cold_food', 'food_not_right', 'need_drink', 'wrong_order'];

  function byId(list) {
    var m = {};
    for (var i = 0; i < list.length; i++) m[list[i].id] = list[i];
    return m;
  }
  var UPGRADE = byId(UPGRADES);
  var CONDITION = byId(CONDITIONS);
  var ACTION = byId(ACTIONS);

  function has(selected, id) { return selected.indexOf(id) !== -1; }

  function spent(selected) {
    var total = 0;
    for (var i = 0; i < selected.length; i++) total += UPGRADE[selected[i]].cost;
    return total;
  }
  function coinsLeft(selected) { return BUDGET - spent(selected); }

  /* What happens if the child taps this shop item. */
  function canBuy(selected, upgradeId) {
    if (has(selected, upgradeId)) return { ok: false, owned: true, need: 0 };
    var left = coinsLeft(selected);
    var cost = UPGRADE[upgradeId].cost;
    return cost <= left ? { ok: true, need: 0 } : { ok: false, need: cost - left };
  }
  function buy(selected, upgradeId) {
    if (!canBuy(selected, upgradeId).ok) return selected.slice();
    return selected.concat([upgradeId]);
  }
  function sell(selected, upgradeId) {
    return selected.filter(function (u) { return u !== upgradeId; });
  }

  function startingPopularity(selected) {
    var p = BASE_POPULARITY;
    for (var i = 0; i < selected.length; i++) p += UPGRADE[selected[i]].bonus || 0;
    return p;
  }

  function actionAvailable(actionId, selected) {
    var req = ACTION[actionId].requires;
    return !req || has(selected, req);
  }

  function isComplete(rule) { return !!(rule && rule.condition && rule.action); }

  /* First complete rule, in visible order, whose IF matches. */
  function findRule(rules, condition) {
    for (var i = 0; i < rules.length; i++) {
      if (isComplete(rules[i]) && rules[i].condition === condition) return { rule: rules[i], index: i };
    }
    return null;
  }

  function evaluateEvent(condition, rules, selected, scoreBefore) {
    var hit = findRule(rules, condition);
    var outcome, delta, missing;
    if (!hit) { outcome = 'unhandled'; delta = -1; }
    else if (!actionAvailable(hit.rule.action, selected)) {
      outcome = 'missing_upgrade'; delta = -1; missing = ACTION[hit.rule.action].requires;
    } else if (HELPFUL[condition].indexOf(hit.rule.action) !== -1) { outcome = 'helpful'; delta = 1; }
    else { outcome = 'unhelpful'; delta = -1; }
    var res = {
      condition: condition,
      ruleId: hit ? hit.rule.id : null,
      ruleIndex: hit ? hit.index : null,
      action: hit ? hit.rule.action : null,
      outcome: outcome,
      requestedDelta: delta,
      scoreBefore: scoreBefore,
      scoreAfter: Math.max(0, scoreBefore + delta)
    };
    if (missing) res.missingUpgrade = missing;
    return res;
  }

  function simulateDay(rules, selected, day) {
    day = day || DEFAULT_DAY;
    var score = startingPopularity(selected);
    var start = score;
    var log = [];
    for (var i = 0; i < day.length; i++) {
      var r = evaluateEvent(day[i], rules, selected, score);
      log.push(r);
      score = r.scoreAfter;
    }
    return { start: start, final: score, log: log };
  }

  /* Inline notes for each rule slot, derived from state. */
  function ruleNotes(rules, selected) {
    var notes = [];
    var firstWith = {};
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      var n = { empty: false, incomplete: false, needsUpgrade: null, shadowedBy: null };
      if (!r.condition && !r.action) n.empty = true;
      else if (!r.condition || !r.action) n.incomplete = true;
      if (r.action && !actionAvailable(r.action, selected)) n.needsUpgrade = ACTION[r.action].requires;
      if (isComplete(r)) {
        if (firstWith[r.condition] !== undefined) n.shadowedBy = firstWith[r.condition];
        else firstWith[r.condition] = i;
      }
      notes.push(n);
    }
    return notes;
  }

  /* Things worth mentioning before the day starts. */
  function startCheck(rules, selected) {
    var notes = ruleNotes(rules, selected);
    var out = { complete: 0, incomplete: 0, needsUpgrade: 0 };
    for (var i = 0; i < rules.length; i++) {
      if (isComplete(rules[i])) out.complete++;
      if (notes[i].incomplete) out.incomplete++;
      if (isComplete(rules[i]) && notes[i].needsUpgrade) out.needsUpgrade++;
    }
    return out;
  }

  function joinOr(items) {
    if (items.length <= 1) return items.join('');
    return items.slice(0, -1).join(', ') + ' or ' + items[items.length - 1];
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* Best helpful action to suggest: owned first, else the first helpful one. */
  function suggestAction(condition, selected) {
    var list = HELPFUL[condition];
    for (var i = 0; i < list.length; i++) if (actionAvailable(list[i], selected)) return list[i];
    return list[0];
  }

  function tipFor(entry, selected) {
    var c = CONDITION[entry.condition];
    if (entry.outcome === 'unhandled') {
      var s = ACTION[suggestAction(entry.condition, selected)];
      var text = c.story + ", but the robot didn't have a rule for it. Try adding IF “" + c.label +
        '” → THEN “' + s.label + '”.';
      var fix = { kind: 'code' };
      if (s.requires && !has(selected, s.requires)) {
        var u = UPGRADE[s.requires];
        text += ' That needs the ' + u.short + ' (' + u.cost + ' coins), so you may need to change your budget.';
        fix = { kind: 'shop', upgrade: s.requires };
      }
      return { key: 'unhandled:' + entry.condition, text: text, fix: fix };
    }
    if (entry.outcome === 'missing_upgrade') {
      var up = UPGRADE[entry.missingUpgrade];
      var a = ACTION[entry.action];
      return {
        key: 'missing:' + entry.missingUpgrade,
        text: 'Your robot wanted to ' + a.verb + ", but your restaurant didn't have the " + up.short +
          '. It costs ' + up.cost + ' coins in the shop. You could also pick a different THEN block.',
        fix: { kind: 'shop', upgrade: entry.missingUpgrade }
      };
    }
    if (entry.outcome === 'unhelpful') {
      var act = ACTION[entry.action];
      var owned = HELPFUL[entry.condition].filter(function (id) { return actionAvailable(id, selected); });
      var opts = (owned.length ? owned : HELPFUL[entry.condition]).slice(0, 2);
      if (HELPFUL[entry.condition].indexOf('apologize') !== -1 && opts.indexOf('apologize') === -1) {
        opts = opts.slice(0, 1).concat(['apologize']);
      }
      var words = opts.map(function (id) { return ACTION[id].doing; });
      var t = cap(act.doing) + " didn't help with " + c.problem + '. Try ' + joinOr(words) + '.';
      var needs = opts.filter(function (id) { return !actionAvailable(id, selected); });
      if (needs.length && needs.length === opts.length) {
        var nu = UPGRADE[ACTION[needs[0]].requires];
        t += ' That needs the ' + nu.short + ' (' + nu.cost + ' coins).';
      }
      return { key: 'unhelpful:' + entry.condition, text: t, fix: { kind: 'code' } };
    }
    return null;
  }

  /* Up to two concrete improvements drawn only from the actual event log. */
  function coaching(log, selected) {
    var tips = [];
    var seen = {};
    for (var i = 0; i < log.length && tips.length < 2; i++) {
      var tip = tipFor(log[i], selected);
      if (tip && !seen[tip.key]) { seen[tip.key] = true; tips.push(tip); }
    }
    var allHelpful = log.length > 0 && log.every(function (e) { return e.outcome === 'helpful'; });
    if (allHelpful) {
      tips.push({ key: 'perfect', text: 'You planned for every customer today! Try a different budget and see what changes.', fix: { kind: 'shop' } });
    }
    return tips;
  }

  function summarize(day) {
    var count = function (o) { return day.log.filter(function (e) { return e.outcome === o; }).length; };
    return {
      final: day.final,
      start: day.start,
      change: day.final - day.start,
      helpful: count('helpful'),
      unhandled: count('unhandled'),
      unhelpful: count('unhelpful'),
      missingUpgrade: count('missing_upgrade'),
      total: day.log.length
    };
  }

  var api = {
    BUDGET: BUDGET, BASE_POPULARITY: BASE_POPULARITY, MAX_RULES: MAX_RULES,
    UPGRADES: UPGRADES, CONDITIONS: CONDITIONS, ACTIONS: ACTIONS, HELPFUL: HELPFUL, WHY: WHY,
    DEFAULT_DAY: DEFAULT_DAY, UPGRADE: UPGRADE, CONDITION: CONDITION, ACTION: ACTION,
    spent: spent, coinsLeft: coinsLeft, canBuy: canBuy, buy: buy, sell: sell,
    startingPopularity: startingPopularity, actionAvailable: actionAvailable, isComplete: isComplete,
    findRule: findRule, evaluateEvent: evaluateEvent, simulateDay: simulateDay,
    ruleNotes: ruleNotes, startCheck: startCheck, coaching: coaching, summarize: summarize
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.RR = api;
})(typeof window !== 'undefined' ? window : this);
</script>
<script>

  function has(sel, id) { return sel.indexOf(id) !== -1; }

      '<rect x="' + (x - 8) + '" y="334" width="16" height="66" fill="#7A5A3E"/><ellipse cx="' + x + '" cy="404" rx="40" ry="8" fill="#7A5A3E"/>' +

  }

</script>
<script>
/* Robot Restaurant UI. Depends on window.RR (engine.js) and window.ART (art.js). */
(function () {
  'use strict';

  var app = document.getElementById('app');
  var live = document.getElementById('live');
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- state ---------------- */
  function freshRules() {
    return [1, 2, 3, 4].map(function (n) { return { id: 'r' + n, condition: null, action: null }; });
  }
  function freshState(previousLineup) {

  var S = freshState();
  var lastBought = null;
  var sound = false;
  var timers = [];

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function announce(msg) { live.textContent = ''; setTimeout(function () { live.textContent = msg; }, 30); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------------- sound (generated tones, off by default) ---------------- */
  var actx = null;
  function beep(kind) {
    if (!sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var notes = { tap: [660], place: [520, 780], good: [523, 659, 784], bad: [330, 247], coin: [988, 1319] }[kind] || [600];
      notes.forEach(function (f, i) {
        var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.09;
        o.type = kind === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.2);
      });
    } catch (e) { /* audio is optional */ }
  }

  /* ---------------- rendering helpers ---------------- */
  var STEPS = [['budget', 'Build'], ['code', 'Train'], ['simulation', 'Open'], ['results', 'Results']];
  function topbar() {
    var idx = STEPS.findIndex(function (s) { return s[0] === S.screen; });
    var steps = STEPS.map(function (s, i) {
      return '<li class="' + (i < idx ? 'done' : '') + '"' + (i === idx ? ' aria-current="step"' : '') + '><b>' + (i < idx ? '✓' : i + 1) + '</b><span>' + s[1] + '</span></li>';
    }).join('');
    return '<header class="topbar">' +
      '<div class="brand">' + I('robot') + '<span>Robot Restaurant</span></div>' +
      '<button class="tb-btn" data-act="colab-home">Activities</button>' +
      '<ol class="steps" aria-label="Game steps">' + steps + '</ol>' +
      soundBtn('tb-btn') +
      '<button class="tb-btn" data-act="startover" data-k="startover">' + I('restart') + '<span>Start over</span></button>' +
      '</header>';
  }
  function soundBtn(cls) {
    return '<button class="' + cls + '" data-act="sound" data-k="sound-' + cls + '" aria-pressed="' + sound + '">' +
      I(sound ? 'soundOn' : 'soundOff') + '<span>Sound ' + (sound ? 'on' : 'off') + '</span></button>';
  }
  function coinDots(left) {
    var s = '';
    for (var i = 0; i < RR.BUDGET; i++) s += '<span class="coin-dot' + (i < left ? '' : ' spent') + '"></span>';
    return '<span class="coin-row" aria-hidden="true">' + s + '</span>';
  }
  function stars(n) {
    var s = '', show = Math.max(10, n);

  }

  function blockHTML(kind, id, opts) {
    opts = opts || {};
    var isIf = kind === 'if';
    var d = isIf ? RR.CONDITION[id] : RR.ACTION[id];
    var locked = !isIf && !RR.actionAvailable(id, S.selected);
    var req = locked ? '<span class="req">' + I('lock') + 'Requires ' + esc(RR.UPGRADE[d.requires].short) + '</span>' : '';
    var armed = S.armed && S.armed.kind === kind && S.armed.id === id && opts.palette;
    var tag = opts.tag || 'button';
    var label = (isIf ? 'IF customer says: ' : 'THEN robot: ') + d.label + (locked ? '. Requires ' + RR.UPGRADE[d.requires].short : '');
    var attrs = opts.palette
      ? ' data-act="arm" data-kind="' + kind + '" data-id="' + id + '" data-k="pal-' + kind + '-' + id + '" aria-pressed="' + !!armed + '" aria-label="' + esc(label) + '"'

    return '<' + tag + ' class="block b-' + kind + (locked ? ' locked' : '') + (armed ? ' armed' : '') + '"' + attrs + '>' +
      '<span class="kw">' + (isIf ? 'IF' : 'THEN') + '</span>' + I(id) +
      '<span class="txt">' + esc(d.label) + req + '</span>' +
      (opts.palette ? '<span class="block-grip" aria-hidden="true"></span>' : '') + '</' + tag + '>';
  }
  function mini(kind, id) {
    var d = kind === 'if' ? RR.CONDITION[id] : RR.ACTION[id];
    return '<span class="mini m-' + kind + '"><span class="kw">' + (kind === 'if' ? 'IF' : 'THEN') + '</span>' + esc(d.label) + '</span>';
  }

  var CHALLENGE_BUDGET = 12;
  var CHALLENGE_POPULARITY_PER_REQUEST = .5;
  var CHALLENGE_POPULARITY_PER_UPGRADE = .5;
  var CHALLENGE_GUEST_UPGRADES = ['comfort_booth', 'fun_decor'];
  var POLICIES = [
    { id: 'growth', name: 'Growth Fund', price: 5, bonus: 30, protection: 0, icon: 'star', detail: 'Earn 30% more coins from each guest you fully help.' },
    { id: 'steady', name: 'Steady Saver', price: 3, bonus: 15, protection: 0, icon: 'coin', detail: 'Earn 15% more coins from each guest you fully help.' },
    { id: 'safety', name: 'Safety Net', price: 4, bonus: 0, protection: .5, icon: 'refund', detail: 'Lose 0.5 fewer coins each time service falls short.' }
  ];

  function coinAmount(amount) { return Math.round(amount * 100) / 100; }

  function shuffle(items) {
    for (var i = items.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var item = items[i];
      items[i] = items[j];
      items[j] = item;
    }
    return items;
  }

  function challengeGuests(day) {
    var conditions = shuffle(RR.DEFAULT_DAY.slice());
    var vips = shuffle([true, day === 3, false, false]);
    var people = shuffle([0, 1, 2, 3, 4, 5, 6, 7]);
    var suits = shuffle([8, 9]);
    return conditions.map(function (condition, i) {
      var vip = vips[i];
      var needs = [condition];
      if (vip) needs.push(conditions[(i + 1 + Math.floor(Math.random() * 3)) % conditions.length]);
      return {
        needs: needs, vip: vip, person: vip ? suits.pop() : people.pop(),
        pay: [.5, 1, 1.5, 2][Math.floor(Math.random() * 4)],
        cost: [1, 1.5, 2][Math.floor(Math.random() * 3)],
        loss: [.5, 1, 1.5, 2][Math.floor(Math.random() * 4)]
      };
    });
  }

  function challengeDay(hard, rules, selected) {
    var coins = hard.coins, popularity = hard.popularity, log = [];
    var guestBonus = CHALLENGE_GUEST_UPGRADES.filter(function (id) {
      return selected.indexOf(id) !== -1;
    }).length * CHALLENGE_POPULARITY_PER_UPGRADE;
    var policy = hard.policy || { bonus: 0, protection: 0 };
    hard.guests.some(function (guest) {
      var checks = guest.needs.map(function (condition) {
        var check = RR.evaluateEvent(condition, rules, selected, popularity);
        if (check.outcome === 'helpful' && check.action === 'apologize') check.outcome = 'partial';
        return check;
      });
      var helped = checks.every(function (check) { return check.outcome === 'helpful'; });
      var partial = !guest.vip && checks[0].outcome === 'partial';
      var factor = guest.vip ? 2 : 1;
      var cashChange = helped ? coinAmount(guest.pay * factor * (1 + policy.bonus / 100))
        : partial ? 0 : -Math.max(0, guest.cost * factor - policy.protection);
      var popularityBonus = helped ? guestBonus : 0;
      var popChange = helped ? CHALLENGE_POPULARITY_PER_REQUEST * guest.needs.length + popularityBonus
        : partial ? 0 : -guest.loss * factor;
      var nextCoins = Math.max(0, coinAmount(coins + cashChange));
      var nextPop = Math.max(0, popularity + popChange);
      log.push({
        guest: guest, checks: checks, helpful: helped, partial: partial, coinsBefore: coins, coinsAfter: nextCoins,
        scoreBefore: popularity, scoreAfter: nextPop, popularityBonus: popularityBonus
      });
      coins = nextCoins;
      popularity = nextPop;
      return coins <= 0 || popularity < 1;
    });
    return { log: log, coins: coins, popularity: popularity };
  }

  function challengeStatus(coins, popularity) {
    return '<div class="challenge-status"><b>Day ' + S.hard.day + ' of 3</b><b>' +
      coins + ' coins</b><b>' + popularity + ' popularity</b></div>';
  }

  function investments() {
    var h = S.hard;
    return '<section class="challenge-investments" aria-labelledby="invest-title"><div class="invest-header"><div>' +
      '<h2 id="invest-title">Invest in your restaurant</h2>' +
      '<p>Pick one policy for the rest of the game, or save your coins.</p></div>' +
      '<span class="coins">' + I('coin') + h.coins + ' coins left</span></div><div class="invest-list">' +
      POLICIES.map(function (policy) {
        var selected = h.policy === policy;
        var affordable = canSpendChallenge(policy.price);
        var benefit = policy.bonus ? '+' + policy.bonus + '% income' : '−' + policy.protection + ' coin loss';
        var label = h.policy ? 'Locked' : affordable ? 'Invest' : 'Insufficient coins';
        return '<article class="invest-choice ' + policy.id + (selected ? ' active' : '') + '">' +
          '<div class="invest-card-top"><span class="invest-benefit">' + benefit + '</span>' + I(policy.icon) + '</div>' +
          '<h3>' + policy.name + '</h3><p>' + policy.detail + '</p><div class="invest-card-footer">' +
          '<span class="invest-price">' + I('coin') + policy.price + ' coins</span>' +
          (selected ? '<span class="invest-active" data-k="policy-' + policy.id + '" tabindex="-1">' + I('check') + 'Active</span>' :
            '<button class="btn btn-small btn-quiet" data-act="invest" data-id="' + policy.id + '" data-k="policy-' + policy.id + '"' +
            ' aria-label="' + label + ' · ' + policy.name + ', ' + policy.price + ' coins"' +
            (h.policy || !affordable ? ' disabled' : '') + '>' + label + '</button>') + '</div></article>';
      }).join('') + '</div></section>';
  }

  function challengeRules() {
    var portraits = [8, 9].map(function (person) {
      return '<svg viewBox="-52 -55 124 180" aria-hidden="true">' + ART.person(person, 'happy') + '</svg>';
    }).join('');
    return '<div class="modal challenge-rules" role="dialog" aria-modal="true" aria-labelledby="m-h">' +
      '<h2 id="m-h" tabindex="-1">Chef’s Challenge rules</h2><div class="challenge-rule-grid">' +
      '<section><h3>Survive 3 days</h3><p>Start with <b>' + CHALLENGE_BUDGET + ' coins</b> and <b>5 popularity</b>. Each day has four guests. Rework your rules and buy upgrades between days. During service, your run ends at <b>0 coins</b> or below <b>1 popularity</b>.</p></section>' +
      '<section><h3>Earn and invest</h3><p>Earn coins and <b>+0.5 popularity per request</b> when you fully help a guest. Comfy Booths and Fun Decorations each add <b>+0.5 per fully helped guest</b>. Miss a request and lose coins and popularity.</p>' +
      '<p>An apology for a regular guest’s food problem earns partial credit. Coins and popularity stay the same.</p>' +
      '<p>Pick one policy or save your coins. <b>Growth Fund</b> adds 30% income for 5 coins. <b>Steady Saver</b> adds 15% for 3. <b>Safety Net</b> reduces losses for 4.</p></section>' +
      '<section><h3>Look for VIP guests</h3><div class="vip-portraits" role="img" aria-label="Two VIP guests in suits carrying briefcases">' + portraits +
      '</div><p>VIPs bring <b>two requests</b>. Solve both for <b>2× coins</b> and <b>+1 base popularity</b>. An apology alone counts as a missed request. Miss either and lose <b>2× the coins and popularity</b>.</p></section></div>' +
      '<label class="nickname">Leaderboard nickname (optional)<input name="nickname" maxlength="18" placeholder="e.g. PizzaPilot" autocomplete="off" spellcheck="false">' +
      '<small>Use a made-up nickname with letters, numbers, spaces, underscores, or hyphens. You can choose to post your result at the end.</small></label>' +
      '<div class="row"><button type="button" class="btn btn-quiet btn-small" data-act="close">Back</button>' +
      '<button type="button" class="btn btn-quiet btn-small" data-act="board">Leaderboard</button>' +
      '<button type="button" class="btn btn-go btn-small" data-act="start-challenge">Start Day 1</button></div></div>';
  }

  function challengeSimulation() {
    var e = S.day.log[S.eventIndex], guest = e.guest, revealed = S.phase === 3;
    var last = S.eventIndex === S.day.log.length - 1;
    var label = guest.vip ? 'VIP guest' : 'Guest';
    var outcomeClass = e.helpful ? 'good' : e.partial ? 'partial' : 'bad';
    var outcomeTitle = e.helpful ? 'Guest helped!' : e.partial ? 'Partial credit' : 'Service fell short';
    var outcomeNote = e.partial ? 'Pip apologized. No coins or popularity gained or lost.' :
      guest.vip && !e.helpful ? 'VIP guests need both requests solved.' : '';
    var requests = e.checks.map(function (check) {
      var action = check.action ? RR.ACTION[check.action].label : 'No rule matched';
      if (check.missingUpgrade) action += ' (upgrade needed)';
      if (check.outcome === 'partial') action += guest.vip ? ' (request unresolved)' : ' (partial credit)';
      return '<li>“' + esc(RR.CONDITION[check.condition].says) + '”' +
        (revealed ? '<br><b>' + (check.outcome === 'helpful' ? '✓ ' : check.outcome === 'partial' ? '' : '× ') + esc(action) + '</b>' : '') + '</li>';
    }).join('');
    var art = ART.scene({
      selected: S.selected, robotX: revealed ? 500 : 420,
      robot: { mood: revealed && !e.helpful ? 'sorry' : 'happy' },
      diner: { person: guest.person, mood: revealed ? (e.helpful ? 'happy' : e.partial ? 'asking' : 'sad') : 'asking',
        food: RR.CONDITION[guest.needs[0]].food },
      label: label + ' at a table with Pip the robot'
    });
    return topbar() + '<main class="screen"><div class="screen-head"><div><h1 tabindex="-1" data-focus>Serve the guests</h1>' +
      '<p>Watch Pip check every request.</p></div>' +
      challengeStatus(revealed ? e.coinsAfter : e.coinsBefore, revealed ? e.scoreAfter : e.scoreBefore) + '</div>' +
      '<div class="sim-grid"><div class="scene-box">' + art + '</div><div class="panel">' +
      '<b' + (guest.vip ? ' class="vip-tag"' : '') + '>' + label + ' ' + (S.eventIndex + 1) + ' of 4</b>' +
      '<ul class="guest-requests">' + requests + '</ul>' +
      (revealed ? '<div class="result challenge-guest-result ' + outcomeClass + '"><h3>' + outcomeTitle + '</h3>' +
        (outcomeNote ? '<p>' + outcomeNote + '</p>' : '') +
        '<p>Coins ' + e.coinsBefore + ' → ' + e.coinsAfter + '<br>Popularity ' + e.scoreBefore + ' → ' + e.scoreAfter + '</p>' +
        (e.popularityBonus ? '<p><b>+' + e.popularityBonus + ' popularity from restaurant upgrades</b></p>' : '') + '</div>' : '') +
      '<button class="btn btn-go" data-act="next" data-k="next">' +
      (!revealed ? 'Show what happens' : last ? 'See day results' : 'Next guest') + I('right') + '</button></div></div></main>';
  }

  function challengeResults() {
    var h = S.hard, final = h.status !== 'playing';
    var title = h.status === 'won' ? 'You survived all 3 days!' :
      h.status === 'lost' ? 'The restaurant closed' : 'Day ' + h.day + ' complete';
    var log = S.day ? S.day.log.map(function (e, i) {
      return '<li><span class="n">' + (i + 1) + '</span><span>' + (e.guest.vip ? 'VIP guest' : 'Guest') +
        ' · ' + (e.helpful ? 'Helped' : e.partial ? 'Partial credit' : 'Missed a request') + '</span><span>' + e.coinsBefore + ' → ' + e.coinsAfter + ' coins</span></li>';
    }).join('') : '';
    var reason = h.status === 'lost' ? '<p>' + challengeLossReason() + '</p>' : '';
    return topbar() + '<main class="screen"><div class="screen-head"><div><h1 tabindex="-1" data-focus>' + title + '</h1>' + reason + '</div>' +
      challengeStatus(h.coins, h.popularity) + '</div><section class="receipt"><h2>Restaurant receipt</h2>' +
      '<p>Days completed: <b>' + h.completed + ' of 3</b></p><ol class="rlog">' + log + '</ol></section>' +
      '<div class="bottombar">' + (final
        ? '<button class="btn btn-quiet btn-small" data-act="board">Leaderboard</button>' +
          (h.nickname ? '<button class="btn btn-plum btn-small" data-act="save-score">Save score as ' + esc(h.nickname) + '</button>' : '') +
          '<button class="btn btn-go btn-small" data-act="again">Play again</button>'
        : '<button class="btn btn-go" data-act="next-day">Plan Day ' + (h.day + 1) + I('right') + '</button>') + '</div></main>';
  }

  var scores = [];
  var SCORE_KEY = 'robot-restaurant-challenge-scores-v1';
  function scoreOrder(a, b) { return b.days - a.days || b.popularity - a.popularity || b.coins - a.coins; }

  function readScores() {
    try {
      var stored = JSON.parse(window.localStorage.getItem(SCORE_KEY));
      return Array.isArray(stored) ? stored : scores;
    }
    catch (_) { return scores; }
  }

  function saveLocalScore(entry) {
    scores = readScores();
    var old = scores.find(function (score) { return score.nickname.toLowerCase() === entry.nickname.toLowerCase(); });
    if (!old || scoreOrder(entry, old) < 0) {
      scores = scores.filter(function (score) { return score !== old; });
      scores.push(entry);
    }
    scores.sort(scoreOrder);
    scores = scores.slice(0, 10);
    try { window.localStorage.setItem(SCORE_KEY, JSON.stringify(scores)); } catch (_) {}
    return scores;
  }

  function leaderboard() {
    var board = S.board;
    var entries = board.entries.map(function (entry) {
      return '<li><b>' + esc(entry.nickname) + '</b> · ' + entry.days + '/3 days · ' + entry.popularity +
