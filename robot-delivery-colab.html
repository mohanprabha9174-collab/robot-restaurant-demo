    }).join('');
    return '<main class="screen"><div class="screen-head"><div><h1 tabindex="-1" data-focus>Chef’s Challenge leaderboard</h1>' +
      '<p role="status">' + board.label + '</p></div></div><section class="challenge-board"><h2>Top 10</h2>' +
      '<p>Ranked by days completed, then popularity, then coins.</p>' +
      (entries ? '<ol>' + entries + '</ol>' : '<p>No scores yet.</p>') +
      '</section><div class="bottombar"><button class="btn btn-quiet" data-act="board-back" data-k="board-back">' + I('left') + 'Back</button></div></main>';
  }

  async function openBoard(entry) {
    var origin = S.screen, board = { origin: origin, entries: [], label: 'Loading scores…' };
    S.board = board;
    go('leaderboard');
    try {
      if (!/^https?:$/.test(window.location.protocol)) throw new Error('Offline');
      var options = { signal: AbortSignal.timeout(3500) };
      if (entry) Object.assign(options, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry) });
      var response = await fetch('/api/leaderboard', options);
      if (!response.ok) throw new Error('Leaderboard unavailable');
      board.entries = (await response.json()).entries;
      if (!Array.isArray(board.entries)) throw new Error('Invalid leaderboard');
      board.label = entry ? 'Score saved to the shared leaderboard.' : 'Shared leaderboard';
    } catch (_) {
      board.entries = entry ? saveLocalScore(entry) : readScores();
      board.label = entry ? 'Score saved for this browser. Open the hosted game for shared scores.' : 'Scores for this browser';
    }
    if (S.board === board && S.screen === 'leaderboard') render();
  }

  function beginChallenge(nickname) {
    S.hard = { nickname: nickname, day: 1, completed: 0, coins: CHALLENGE_BUDGET, popularity: RR.BASE_POPULARITY,
      policy: null, status: 'playing', guests: challengeGuests(1) };
    go('budget');
  }

  function startChallenge() {
    var input = app.querySelector('.challenge-rules input[name="nickname"]');
    var nickname = input.value.trim();
    if (nickname && !/^[A-Za-z0-9 _-]{1,18}$/.test(nickname)) {
      input.setCustomValidity('Use letters, numbers, spaces, underscores, or hyphens. You can also leave the nickname blank.');
      input.reportValidity();
      return;
    }
    beginChallenge(nickname);
  }

  function canSpendChallenge(cost) {
    return S.hard.coins > cost;
  }

  function spendChallenge(cost) {
    S.hard.coins = coinAmount(S.hard.coins - cost);
    render();
  }

  function challengeLossReason() {
    return S.hard.coins === 0 ? 'Your restaurant went bankrupt.' :
      'The reviews went cold. With popularity below 1, Pip flipped the sign to CLOSED.';
  }

  function showChallengeLoss() {
    S.hard.status = 'lost';
    go('results', { type: 'challenge-loss' });
  }

  function finishChallengeDay() {
    var h = S.hard;
    h.coins = S.day.coins;
    h.popularity = S.day.popularity;
    if (h.coins === 0 || h.popularity < 1) return showChallengeLoss();
    h.completed = h.day;
    if (h.day === 3) h.status = 'won';
    go('results');
  }

  /* ---------------- screens ---------------- */
  function welcome() {
    var titleClass = lastScreen !== 'welcome' ? ' class="welcome-title-drop"' : '';
    var content = '<h1' + titleClass + ' tabindex="-1" data-focus><span class="title-intro">Welcome to</span> Robot <span class="title-accent">Restaurant</span></h1>' +
        '<p class="lede">Build a restaurant. Train your robot. Keep customers happy!</p>' +
        '<section class="mode-picker" aria-labelledby="mode-heading">' +
        '<h2 id="mode-heading">Which difficulty would you like to play?</h2>' +
        '<div class="mode-options">' +
        '<button type="button" class="mode-card" data-act="play" data-k="play">' + I('play') +
        '<span><span class="mode-name">Starter Shift</span><span class="mode-detail">Learn the ropes</span></span>' + I('right') + '</button>' +
        '<button type="button" class="mode-card challenge" data-act="challenge" data-k="challenge">' + I('star') +
        '<span><span class="mode-name">Chef’s Challenge</span><span class="mode-detail">Survive three days</span></span>' + I('right') + '</button>' +
        '</div></section>';
    return '<main class="screen welcome">' +
      '<div class="welcome-bar"><p class="kicker">' + I('robot') + 'A budget + coding game</p>' + soundBtn('btn btn-quiet btn-small') + '</div>' +
      '<div class="welcome-grid"><div class="welcome-copy">' + content + '</div>' +
      '<figure class="welcome-art"><div class="scene-box">' + ART.scene({ selected: ['fun_decor', 'drink_station'], robot: { wave: true, mood: 'happy' }, label: 'A friendly robot waiter waving in a colorful restaurant' }) + '</div>' +
      '<figcaption>Hi! I’m Pip, your robot waiter.</figcaption></figure></div>' +
      '</main>';
  }

  function budget() {
    var hard = S.hard;
    var left = hard ? hard.coins : RR.coinsLeft(S.selected);
    var items = RR.UPGRADES.map(function (u) {
      var owned = S.selected.indexOf(u.id) !== -1;
      var can = hard ? { ok: canSpendChallenge(u.cost) } : RR.canBuy(S.selected, u.id);
      var effect = hard && CHALLENGE_GUEST_UPGRADES.indexOf(u.id) !== -1
        ? 'Gain +' + CHALLENGE_POPULARITY_PER_UPGRADE + ' popularity per guest you fully help.' : u.effect;
      var btn;
      if (owned && hard) btn = '<span class="badge-owned">' + I('check') + 'Installed</span>';
      else if (owned) btn = '<button class="buy remove" data-act="sell" data-id="' + u.id + '" data-k="b-' + u.id + '" aria-label="Remove ' + esc(u.name) + ' and get ' + u.cost + ' coins back">' + I('x') + 'Remove (get ' + u.cost + ' back)</button>';
      else if (can.ok) btn = '<button class="buy" data-act="buy" data-id="' + u.id + '" data-k="b-' + u.id + '" aria-label="Buy ' + esc(u.name) + ' for ' + u.cost + ' coins">Buy for ' + u.cost + I('coin') + '</button>';
      else btn = '<button class="buy" aria-disabled="true" data-act="cantbuy" data-id="' + u.id + '" data-k="b-' + u.id + '">' +
        (hard ? 'Can’t buy · Insufficient coins' : 'Need ' + can.need + ' more coin' + (can.need > 1 ? 's' : '')) + '</button>';
      return '<li class="item' + (owned ? ' owned' : '') + '">' +
        '<span class="art">' + I(u.id) + '</span>' +
        '<h3>' + esc(u.name) + '<span class="price">' + u.cost + I('coin') + '</span></h3>' +
        '<p>' + esc(effect) + (owned ? ' <span class="badge-owned">' + I('check') + 'Bought</span>' : '') + '</p>' +
        '<div class="act">' + btn + '</div></li>';
    }).join('');
    var bought = S.selected.length
      ? S.selected.map(function (id) { return RR.UPGRADE[id].short; }).join(', ')
      : 'nothing yet';
    return topbar() + '<main class="screen">' +
      '<div class="screen-head"><div><h1 tabindex="-1" data-focus>Build your restaurant</h1>' +
      '<p>' + (hard ? 'Keep some coins for service. The shop won’t let you spend your last coins. Your upgrades and coins carry forward.' : 'You have 10 coins. You can’t buy everything, so pick what matters most. Coins you don’t spend are saved.') + '</p></div>' +
      (hard ? challengeStatus(left, hard.popularity) : '') + '</div>' +
      '<div class="budget-grid"><section aria-label="Your restaurant">' +
      '<div class="purse"><div><div class="lbl">Coins left</div><div class="big" aria-live="polite">' + left + (hard ? '' : ' <span class="sr">of 10 coins left</span>') + '</div></div>' + (hard ? '' : coinDots(left)) + '</div>' +
      '<div class="scene-box">' + ART.scene({ selected: S.selected, fresh: lastBought, robot: { mood: 'happy' }, label: 'Your restaurant. Upgrades bought: ' + bought }) + '</div>' +
      '<p class="starter"><b>Free to start:</b> a basic kitchen, tables, and one robot waiter. <b>Bought:</b> ' + esc(bought) + '.</p>' +
      '</section>' +
      '<section class="shop" aria-labelledby="shop-h"><h2 id="shop-h">Upgrade shop</h2>' +
      '<p>Some upgrades unlock robot actions. Choose what matters most!</p>' +
      '<ul class="shop-list">' + items + '</ul></section></div>' + (hard ? investments() : '') +
      '<div class="bottombar"><span class="coins">' + I('coin') + left + ' coin' + (left === 1 ? '' : 's') + ' left</span>' +
      '<button class="btn btn-go" data-act="go-code" data-k="go-code">Train my robot' + I('right') + '</button></div>' +
      '</main>';
  }

  function zoneHTML(i, kind) {
    var r = S.rules[i];
    var val = kind === 'if' ? r.condition : r.action;
    var target = S.armed && S.armed.kind === kind;
    var name = 'Rule ' + (i + 1) + ' ' + (kind === 'if' ? 'IF' : 'THEN') + ' space';
    if (val) {
      var d = kind === 'if' ? RR.CONDITION[val] : RR.ACTION[val];
      return '<div class="zone filled z-' + kind + (target ? ' target' : '') + '" data-zone="' + i + '" data-kind="' + kind + '">' +
        blockHTML(kind, val, { attrs: ' data-act="zone" data-i="' + i + '" data-kind="' + kind + '" data-k="z-' + i + kind + '" aria-label="' + esc(name + ': ' + d.label + (target ? '. Tap to replace' : '. Tap to change')) + '"' }) +
        '<button class="clear-x" data-act="clear" data-i="' + i + '" data-kind="' + kind + '" data-k="x-' + i + kind + '" aria-label="Remove ' + esc(d.label) + ' from rule ' + (i + 1) + '">' + I('x') + '</button></div>';
    }
    return '<button class="zone z-' + kind + (target ? ' target' : '') + '" data-zone="' + i + '" data-kind="' + kind + '" data-act="zone" data-i="' + i + '" data-k="z-' + i + kind + '" aria-label="' + esc(name + ', empty') + '">' +
      '<span class="zl"><span class="zk">' + (kind === 'if' ? 'IF customer says…' : 'THEN robot…') + '</span><small>' + (target ? 'Tap to place here' : 'Tap or drop a block') + '</small></span></button>';
  }

  function code() {
    var notes = RR.ruleNotes(S.rules, S.selected);
    var tickets = S.rules.map(function (r, i) {
      var n = notes[i], nn = '';
      if (n.incomplete) nn += '<div class="note warn">' + I('question') + 'Finish or remove this rule. It won’t run until it has an IF and a THEN.</div>';
      if (n.needsUpgrade) {
        var u = RR.UPGRADE[n.needsUpgrade];
        nn += '<div class="note warn">' + I('lock') + 'This needs the ' + esc(u.short) + ' (' + u.cost + ' coins). Without it, the robot can’t do this.' +
          '<button class="link" data-act="go-budget" data-k="nu-' + i + '">Go to shop</button></div>';
      }
      if (n.shadowedBy !== null) nn += '<div class="note info">' + I('up') + 'Same IF as rule ' + (n.shadowedBy + 1) + '. First matching rule runs first, so this one won’t run.</div>';
      return '<li class="ticket" aria-label="Rule ' + (i + 1) + '"><div class="t-head"><span class="t-num"><b>' + (i + 1) + '</b>Rule ' + (i + 1) + '</span>' +
        '<span class="t-tools">' +
        '<button class="icon-btn" data-act="up" data-i="' + i + '" data-k="up-' + i + '" aria-label="Move rule ' + (i + 1) + ' up"' + (i === 0 ? ' disabled' : '') + '>' + I('up') + '</button>' +
        '<button class="icon-btn" data-act="down" data-i="' + i + '" data-k="dn-' + i + '" aria-label="Move rule ' + (i + 1) + ' down"' + (i === S.rules.length - 1 ? ' disabled' : '') + '>' + I('down') + '</button>' +
        '<button class="icon-btn" data-act="trash" data-i="' + i + '" data-k="tr-' + i + '" aria-label="Clear rule ' + (i + 1) + '"' + (n.empty ? ' disabled' : '') + '>' + I('trash') + '</button>' +
        '</span></div>' +
        '<div class="t-body">' + zoneHTML(i, 'if') + '<span class="t-arrow" aria-hidden="true">' + I('right') + '</span>' + zoneHTML(i, 'then') + '</div>' +
        (nn ? '<div class="notes">' + nn + '</div>' : '') + '</li>';
    }).join('');

    var armbar = '';
    if (S.armed) {
      var ad = S.armed.kind === 'if' ? RR.CONDITION[S.armed.id] : RR.ACTION[S.armed.id];
      armbar = '<div class="armbar" role="status">' + I('right') + '<span>Now tap a glowing ' + (S.armed.kind === 'if' ? 'IF' : 'THEN') + ' space to place “' + esc(ad.label) + '”.</span>' +
        '<button class="btn btn-quiet btn-small" data-act="disarm" data-k="disarm">Cancel</button></div>';
    }

    var palette = '<section class="palette" aria-label="Blocks">' +
      '<h2>' + I('cold_food') + 'IF blocks</h2><p class="hint">What a customer might say.</p>' +
      '<div class="blocks">' + RR.CONDITIONS.map(function (c) { return blockHTML('if', c.id, { palette: true }); }).join('') + '</div>' +
      '<h2>' + I('robot') + 'THEN blocks</h2><p class="hint">What your robot will do.</p>' +
      '<div class="blocks">' + RR.ACTIONS.map(function (a) { return blockHTML('then', a.id, { palette: true }); }).join('') + '</div>' +
      '</section>';

    var main = '<section class="rail" aria-label="Your robot’s rules">' +
      '<div class="code-hint">' + I('robot') + '<span>When a customer says the IF part, your robot tries the THEN part. ' +
      (S.hard ? 'Apologies earn partial credit for regular food complaints. VIPs need both requests solved.' : 'Today’s customers might have food problems or ask for things.') + '</span></div>' +
      armbar +
      '<div class="rail-top"><h2>Robot’s rules</h2><span class="hint">Checked from top to bottom</span></div>' +
      '<div class="rail-bar" aria-hidden="true"></div>' +
      '<ol class="rail" style="list-style:none;margin:0;padding:0">' + tickets + '</ol></section>';

    return topbar() + '<main class="screen">' +
      '<div class="screen-head"><div><h1 tabindex="-1" data-focus>Train your robot</h1>' +
      '<p>Drag a block by its dotted grip onto a matching IF or THEN space. You can also tap a block and then its space.</p></div></div>' +
      '<div class="code-grid' + (S.handbook ? ' hb-open' : '') + '">' + palette + main + (S.handbook ? handbook() : '') + '</div>' +
      '<div class="bottombar"><button class="btn btn-quiet btn-small" data-act="go-budget" data-k="back-shop" aria-label="Back to shop">' + I('left') + '<span class="bl">Back to shop</span></button>' +
      '<button class="btn btn-small hb-btn" data-act="hb" data-k="hb-tab" aria-expanded="' + S.handbook + '" aria-label="' + (S.handbook ? 'Close handbook' : 'Customer Handbook') + '">' + I('book') + '<span class="bl">' + (S.handbook ? 'Close handbook' : 'Customer Handbook') + '</span><span class="bs">Handbook</span></button>' +
      '<button class="btn btn-go" data-act="start-day" data-k="start-day">Start the day' + I('right') + '</button></div>' +
      '</main>';
  }

  var HB = [
    { c: 'cold_food', p: 0, mood: 'upset', text: 'A robot could warm it or tell the kitchen.', sample: ['cold_food', 'warm'] },
    { c: 'wrong_order', p: 3, mood: 'upset', text: 'It could remake the meal, offer a refund, or tell the kitchen.' },
    { c: 'food_not_right', p: 1, mood: 'upset', text: 'It could remake the meal, offer a refund, or tell the kitchen.' },
    { c: 'need_drink', p: 2, mood: 'asking', text: 'It could bring a drink.', needs: 'drink_station' },
    { c: 'praise', p: 0, mood: 'happy', text: 'It could thank the customer.' }
  ];
  function handbook() {
    var entries = HB.map(function (e) {
      var c = RR.CONDITION[e.c];
      var needs = e.sample ? RR.ACTION[e.sample[1]].requires : e.needs;
      var badge = '';
      if (needs) {
        var have = S.selected.indexOf(needs) !== -1;
        badge = '<span class="upbadge ' + (have ? 'have' : 'need') + '">' + I(have ? 'check' : 'lock') +
          (have ? 'You have the ' : 'Requires ') + esc(RR.UPGRADE[needs].short) + '</span>';
      }
      return '<div class="hb-entry"><div class="hb-quote"><svg class="face" viewBox="-50 -50 100 100" aria-hidden="true">' + ART.person(e.p, e.mood) + '</svg>“' + esc(c.says) + '”</div>' +
        '<p>' + esc(e.text) + '</p>' +
        '<div class="hb-sample">' + (e.sample ? '<span>Example:</span>' + mini('if', e.sample[0]) + I('right') + mini('then', e.sample[1]) : mini('if', e.c)) + badge + '</div></div>';
    }).join('');
    return '<aside class="handbook drawer" aria-labelledby="hb-h" data-k="hb-panel">' +
      '<div class="handbook-head"><h2 id="hb-h" tabindex="-1">Robot Waiter Handbook: Things Customers Might Say</h2>' +
      '<button class="btn btn-quiet btn-small" data-act="hb" data-k="hb-close" aria-expanded="true">' + I('x') + 'Back to my rules</button></div>' +
      '<p class="lead">When a customer says the IF part, your robot tries the THEN part.</p>' + entries +
      '<p class="older"><b>Older players:</b> If two rules have the same IF, the first one wins.</p>' +
      '<p class="hint" style="margin:0;font-size:13px;color:var(--ink-2)">These are sample ideas for the game, not real restaurant numbers.</p>' +
      '</aside>';
  }

  /* ---------- simulation ---------- */
  var FOOD_FIX = { warm: 'warm', remake: 'remake', drink: 'drink', refund: 'refund', apologize: 'apologize', thank: 'thank' };
  function simulation() {
    if (S.hard) return challengeSimulation();
    var e = S.day.log[S.eventIndex];
    var c = RR.CONDITION[e.condition];
    var last = S.eventIndex === S.day.log.length - 1;
    var good = e.outcome === 'helpful';
    var robotLine, holding = null, mood = 'happy', title, body;
    if (e.outcome === 'unhandled') {
      robotLine = 'I’m not sure what to do yet.'; mood = 'confused'; holding = 'question';
      title = 'No matching rule yet'; body = 'The robot had no rule for “' + c.label + '”.';
    } else if (e.outcome === 'missing_upgrade') {
      var u = RR.UPGRADE[e.missingUpgrade];
      robotLine = 'I need the ' + u.short + ' to do that!'; mood = 'sorry'; holding = 'lock';
      title = 'This rule needs an upgrade'; body = 'Rule ' + (e.ruleIndex + 1) + ' says “' + RR.ACTION[e.action].label + '”, but the restaurant has no ' + u.short + '.';
    } else {
      robotLine = RR.ACTION[e.action].line; holding = FOOD_FIX[e.action];
      if (good) { title = 'Helpful!'; body = RR.WHY[e.action]; }
      else { mood = 'sorry'; title = 'That didn’t help'; body = 'That didn’t address this customer’s request. Try another response.'; }
    }
    var custMood = S.phase >= 3 ? (good ? 'happy' : 'sad') : (e.condition === 'need_drink' ? 'asking' : 'upset');
    var showBot = S.phase >= 2;
    var matched = e.ruleId
      ? '<div class="matched"><div class="lbl">Rule ' + (e.ruleIndex + 1) + ' matched</div><div class="rule-line">' + mini('if', e.condition) + I('right') + mini('then', e.action) + '</div></div>'
      : '<div class="matched none"><div class="lbl">Rule check</div><div class="rule-line">No matching rule yet</div></div>';
    var clamped = e.scoreBefore + e.requestedDelta !== e.scoreAfter;
    var shownScore = S.phase >= 3 ? e.scoreAfter : e.scoreBefore;
    var dots = S.day.log.map(function (x, i) {
      var cls = i < S.eventIndex || (i === S.eventIndex && S.phase >= 3) ? (x.outcome === 'helpful' ? 'good' : 'bad') : (i === S.eventIndex ? 'on' : '');
      return '<i class="' + cls + '"></i>';
    }).join('');

    var sceneHtml = ART.scene({
      selected: S.selected, robotX: showBot ? 500 : 420,
      robot: { mood: showBot ? mood : 'happy', holding: showBot ? holding : null },
      diner: { person: S.eventIndex, mood: custMood, food: c.food },
      label: 'Customer ' + (S.eventIndex + 1) + ' at a table with the robot waiter'
    });

    return topbar() + '<main class="screen">' +
      '<div class="screen-head"><div><h1 tabindex="-1" data-focus>Restaurant day</h1><p>Watch which rule your robot uses.</p></div>' +
      '<div class="cust-count" aria-label="Customer ' + (S.eventIndex + 1) + ' of 4">Customer ' + (S.eventIndex + 1) + ' of ' + S.day.log.length + ' <span style="display:flex;gap:4px" aria-hidden="true">' + dots + '</span></div></div>' +
      '<div class="sim-grid" data-phase="' + S.phase + '" id="sim">' +
      '<div class="sim-stage"><div class="scene-box">' + sceneHtml + '</div>' +
      '<div class="bubble cust"><span class="who">Customer</span>“' + esc(c.says) + '”</div>' +
      '<div class="bubble bot p2"><span class="who">Pip the robot</span>“' + esc(robotLine) + '”</div></div>' +
      '<div class="panel">' +
      '<div class="meter"><span class="lbl">Popularity</span><span class="num" id="score">' + shownScore + '</span>' + stars(shownScore) + '</div>' +
      '<div class="p1">' + matched + '</div>' +
      '<div class="p3 result ' + (good ? 'good' : 'bad') + '"><span class="delta">' + (good ? '+1' : '−1') + '</span><h3>' + esc(title) + '</h3><p>' + esc(body) + '</p></div>' +
      '<div class="p3 scoreline">Popularity ' + e.scoreBefore + ' → ' + e.scoreAfter + (clamped ? ' (it can’t go below 0)' : '') + '</div>' +
      '<div class="sim-controls">' +
      '<button class="btn btn-go" data-act="next" data-k="next">' + (S.phase < 3 ? 'Show what happens' : last ? 'See results' : 'Next customer') + I('right') + '</button>' +
      '<button class="btn btn-quiet btn-small" data-act="auto" data-k="auto" aria-pressed="' + S.autoplay + '">' + I(S.autoplay ? 'pause' : 'play') + (S.autoplay ? 'Pause' : 'Auto play') + '</button>' +
      '</div></div></div>' +
      '<div class="bottombar"><button class="btn btn-quiet btn-small" data-act="go-code" data-k="back-code">' + I('left') + 'Back to rules</button></div>' +
      '</main>';
  }

  /* ---------- results ---------- */
  function results() {
    if (S.hard) return challengeResults();
    var sum = RR.summarize(S.day);
    var tips = RR.coaching(S.day.log, S.selected);
    var left = RR.coinsLeft(S.selected);
    var ups = S.selected.length ? S.selected.map(function (id) { return esc(RR.UPGRADE[id].short); }).join(', ') : 'None';
    var log = S.day.log.map(function (e, i) {
      var what = e.outcome === 'unhandled' ? 'No rule' : e.outcome === 'missing_upgrade' ? RR.ACTION[e.action].label + ' (needed upgrade)' : RR.ACTION[e.action].label;
      return '<li><span class="n">' + (i + 1) + '</span><span>“' + esc(RR.CONDITION[e.condition].says) + '” → ' + esc(what) + '</span><span class="d ' + (e.outcome === 'helpful' ? 'good' : 'bad') + '">' + (e.requestedDelta > 0 ? '+1' : '−1') + '</span></li>';
    }).join('');
    var ideas = tips.map(function (t, i) {
      var btn = t.fix.kind === 'shop'
        ? '<button class="btn btn-quiet btn-small" data-act="improve-shop" data-k="tip-' + i + '">' + I('coin') + 'Change my budget</button>'
        : '<button class="btn btn-quiet btn-small" data-act="improve" data-k="tip-' + i + '">' + I('robot') + 'Change my rules</button>';
      return '<div class="idea' + (t.key === 'perfect' ? ' win' : '') + '">' + I(t.key === 'perfect' ? 'star' : 'question') + '<div><p>' + esc(t.text) + '</p>' + btn + '</div></div>';
    }).join('');
    var ch = sum.change;
    return topbar() + '<main class="screen"><div class="results-grid">' +
      '<section class="receipt" aria-label="Day receipt"><div class="rhead"><small>ROBOT RESTAURANT · TODAY</small>' +
      '<div class="final" aria-hidden="true">' + sum.final + '</div>' +
      '<h1 tabindex="-1" data-focus>Your restaurant finished with ' + sum.final + ' popularity point' + (sum.final === 1 ? '' : 's') + '!</h1></div>' +
      '<div class="rline"><span>Started the day with</span><b>' + sum.start + '</b></div>' +
      '<div class="rline"><span>Points gained or lost</span><b>' + (ch > 0 ? '+' : ch < 0 ? '−' : '') + Math.abs(ch) + '</b></div>' +
      '<div class="rline"><span>Helpful responses</span><b>' + sum.helpful + ' of ' + sum.total + '</b></div>' +
      '<div class="rline"><span>Customers with no rule</span><b>' + sum.unhandled + '</b></div>' +
      (sum.unhelpful + sum.missingUpgrade ? '<div class="rline"><span>Rules that didn’t help</span><b>' + (sum.unhelpful + sum.missingUpgrade) + '</b></div>' : '') +
      '<div class="rline"><span>Coins saved</span><b>' + left + '</b></div>' +
      '<div class="rline"><span>Upgrades</span><b style="font-size:16px;text-align:right">' + ups + '</b></div>' +
      '<ul class="rlog" aria-label="What happened">' + log + '</ul></section>' +
      '<section class="ideas" aria-labelledby="ideas-h"><h2 id="ideas-h">Ideas to try</h2>' + ideas +
      '<div class="end-actions"><button class="btn btn-go" data-act="improve" data-k="improve">' + I('remake') + 'Improve my code</button>' +
      '<button class="btn btn-quiet" data-act="again" data-k="again">' + I('restart') + 'Play again</button></div>' +
      '</section></div></main>';
  }

  /* ---------- modal ---------- */
  function modalHTML() {
    var m = S.modal;
    if (!m) return '';
    var inner = '';
    if (m.type === 'challenge') return '<div class="scrim" data-act="scrim">' + challengeRules() + '</div>';
    if (m.type === 'challenge-loss') {
      return '<div class="scrim loss-scrim" data-act="dismiss-loss">' +
        '<div class="modal challenge-loss" role="alertdialog" aria-modal="true" aria-labelledby="m-h" aria-describedby="loss-reason">' +
        '<h2 id="m-h" tabindex="-1">You lose</h2><p id="loss-reason">' + challengeLossReason() + '</p>' +
        '<button type="button" class="btn btn-quiet">See my results</button></div></div>';
    }
    if (m.type === 'picker') {
      var list = m.kind === 'if' ? RR.CONDITIONS : RR.ACTIONS;
      var cur = m.kind === 'if' ? S.rules[m.i].condition : S.rules[m.i].action;
      inner = '<h2 id="m-h" tabindex="-1">Choose a' + (m.kind === 'if' ? 'n IF' : ' THEN') + ' block for rule ' + (m.i + 1) + '</h2>' +
        '<div class="choices">' + list.map(function (d) {
          return blockHTML(m.kind, d.id, { attrs: ' data-act="pick" data-id="' + d.id + '" data-k="pk-' + d.id + '"' + (cur === d.id ? ' aria-current="true"' : '') });
        }).join('') + '</div>' +
        '<div class="row">' + (cur ? '<button class="btn btn-quiet btn-small" data-act="pick-clear" data-k="pk-clear">' + I('trash') + 'Remove block</button>' : '') +
        '<button class="btn btn-quiet btn-small" data-act="close" data-k="pk-close">Cancel</button></div>';
    } else {
      inner = '<h2 id="m-h" tabindex="-1">' + esc(m.title) + '</h2>' + m.body +
        '<div class="row"><button class="btn btn-quiet btn-small" data-act="close" data-k="m-no">' + esc(m.no) + '</button>' +
        '<button class="btn btn-go btn-small" data-act="confirm" data-k="m-yes">' + esc(m.yes) + '</button></div>';
    }
    return '<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h">' + inner + '</div></div>';
  }

  /* ---------------- render ---------------- */
  var lastScreen = null;
  function render() {
    try {
      var active = document.activeElement && document.activeElement.getAttribute('data-k');
      var showingLoss = S.modal && S.modal.type === 'challenge-loss';
      var changedScreen = S.screen !== lastScreen;
      var html = showingLoss ? '' : { welcome: welcome, budget: budget, code: code, simulation: simulation, results: results, leaderboard: leaderboard }[S.screen]();
      if (changedScreen && lastScreen !== null && S.screen !== 'welcome') {
        html = html.replace('<main class="screen', '<main class="screen screen-enter');
      }
      app.innerHTML = html + modalHTML();
      var focusEl = null;
      if (S.modal) focusEl = app.querySelector('.modal [data-k="' + active + '"]') || app.querySelector('.modal [aria-current="true"]') || app.querySelector('#m-h');
      else if (changedScreen) { focusEl = app.querySelector('[data-focus]'); window.scrollTo(0, 0); }
      else if (active) focusEl = app.querySelector('[data-k="' + active + '"]');
      if (focusEl) focusEl.focus({ preventScroll: S.screen === lastScreen });
      if (!showingLoss) lastScreen = S.screen;
      lastBought = null;
    } catch (err) {
      app.innerHTML = '<div class="err"><h2>Oops, something went wrong.</h2><p>Your game hit a problem. Tap below to start fresh.</p><button class="btn btn-go" data-act="hardreset">Restart the game</button></div>';
      if (window.console) console.error(err);
    }
  }

  /* ---------------- actions ---------------- */
  function go(screen, modal) {
    clearTimers();
    S.armed = null; S.modal = modal || null;
    if (screen !== 'simulation') S.autoplay = false;
    S.screen = screen;
    render();
  }
  function place(i, kind, id) {
    var r = S.rules[i];
    if (kind === 'if') r.condition = id; else r.action = id;
    S.armed = null;
    beep('place');
    var d = kind === 'if' ? RR.CONDITION[id] : RR.ACTION[id];
    var note = '';
    if (kind === 'then' && !RR.actionAvailable(id, S.selected)) note = ' This needs the ' + RR.UPGRADE[d.requires].short + '.';
    announce('Rule ' + (i + 1) + ' ' + (kind === 'if' ? 'IF' : 'THEN') + ': ' + d.label + '.' + note);
  }
  function startDay() {
    S.day = S.hard ? challengeDay(S.hard, S.rules, S.selected) : RR.simulateDay(S.rules, S.selected, S.lineup);
    S.eventIndex = 0; S.phase = 0; S.modal = null; S.armed = null; S.handbook = false;
    go('simulation');
    reveal();
  }
  function confirmStart() {
    var c = RR.startCheck(S.rules, S.selected);
    var lines = [];
    if (c.complete === 0) lines.push('Your robot has no finished rules yet.');
    if (c.incomplete) lines.push(c.incomplete + ' rule' + (c.incomplete > 1 ? 's are' : ' is') + ' missing an IF or a THEN, so ' + (c.incomplete > 1 ? 'they' : 'it') + ' won’t run.');
    if (c.needsUpgrade) lines.push(c.needsUpgrade + ' rule' + (c.needsUpgrade > 1 ? 's need' : ' needs') + ' an upgrade you didn’t buy.');
    if (!lines.length) return startDay();
    S.modal = {
      type: 'confirm', title: 'Start the day anyway?', yes: 'Start anyway', no: 'Keep working', onYes: startDay,
      body: '<ul>' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul><p>That’s okay! You can test it and see what happens.</p>'
    };
    render();
  }

  /* Staged reveal of one customer. Score only ever comes from the precomputed log. */
  function setPhase(p) {
    if (S.screen !== 'simulation') return;
    S.phase = p;
    if (p === 3) {
      var e = S.day.log[S.eventIndex];
      if (S.hard) {
        beep(e.helpful ? 'good' : e.partial ? 'tap' : 'bad');
        if (e.coinsAfter === 0 || e.scoreAfter < 1) return finishChallengeDay();
        announce((e.helpful ? 'Guest helped. ' : e.partial ? 'Partial credit for an apology. ' : 'Service fell short. ') + e.coinsAfter + ' coins. Popularity is ' + e.scoreAfter + '.');
        return render();
      }
      beep(e.outcome === 'helpful' ? 'good' : 'bad');
      var c = RR.CONDITION[e.condition];
      announce('Customer ' + (S.eventIndex + 1) + ' said: ' + c.says + ' ' + (e.ruleId ? 'Rule ' + (e.ruleIndex + 1) + ' ran.' : 'No matching rule.') + ' ' +
        (e.requestedDelta > 0 ? 'Plus 1.' : 'Minus 1.') + ' Popularity is now ' + e.scoreAfter + '.');
    }
    render();
  }
  function reveal() {
    clearTimers();
    if (REDUCED) { setPhase(3); return scheduleAuto(); }
    later(function () { setPhase(1); }, 900);
    later(function () { setPhase(2); }, 1900);
    later(function () { setPhase(3); scheduleAuto(); }, 2900);
  }
  function scheduleAuto() {
    if (S.autoplay && S.phase === 3) later(function () { if (S.autoplay) next(); }, 3500);
  }
  var lockUntil = 0;
  function next() {
    var now = Date.now();
    if (now < lockUntil) return;
    lockUntil = now + 450;
    if (S.phase < 3) { clearTimers(); setPhase(3); scheduleAuto(); return; }
    if (S.eventIndex < S.day.log.length - 1) { S.eventIndex++; S.phase = 0; render(); reveal(); }
    else if (S.hard) finishChallengeDay();
    else go('results');
  }

  function reset() { clearTimers(); S = freshState(S.lineup); lastScreen = null; render(); }
  function askReset(toWelcome) {
    S.modal = { type: 'confirm', title: 'Start over?', yes: 'Start over', no: 'Keep playing', onYes: reset,
      body: '<p>This clears your upgrades and rules so a new player can start fresh.</p>' };
    render();
  }

  app.addEventListener('click', function (ev) {
    if (dragJustEnded) { dragJustEnded = false; return; }
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var i = +el.getAttribute('data-i');
    var kind = el.getAttribute('data-kind');
    var id = el.getAttribute('data-id');
    switch (act) {
      case 'scrim': if (ev.target === el) { S.modal = null; render(); } return;
      case 'dismiss-loss': S.modal = null; return render();
      case 'colab-home': return window.Colab.home();
      case 'play': beep('tap'); return go('budget');
      case 'challenge': beep('tap'); S.modal = { type: 'challenge', returnK: 'challenge' }; return render();
      case 'start-challenge': return startChallenge();
      case 'invest':
        var policy = POLICIES.find(function (item) { return item.id === id; });
        if (!policy || S.hard.policy || !canSpendChallenge(policy.price)) return;
        S.hard.policy = policy;
        return spendChallenge(policy.price);
      case 'next-day':
        S.hard.day++;
        S.hard.guests = challengeGuests(S.hard.day);
        S.day = null;
        return go('budget');
      case 'board': return openBoard();
      case 'board-back':
        var origin = S.board.origin;
        S.board = null;
        go(origin);
        if (origin === 'welcome') { S.modal = { type: 'challenge', returnK: 'challenge' }; render(); }
        return;
      case 'save-score':
        return openBoard({ nickname: S.hard.nickname, days: S.hard.completed, popularity: S.hard.popularity, coins: S.hard.coins });
      case 'sound': sound = !sound; beep('tap'); announce('Sound ' + (sound ? 'on' : 'off')); return render();
      case 'startover': return askReset();
      case 'hardreset': return reset();
      case 'buy':
        if (S.hard) {
          if (S.selected.indexOf(id) !== -1 || !canSpendChallenge(RR.UPGRADE[id].cost)) return;
          S.selected.push(id); lastBought = id; beep('coin');
          announce('Bought ' + RR.UPGRADE[id].name + '.');
          return spendChallenge(RR.UPGRADE[id].cost);
        }
        S.selected = RR.buy(S.selected, id); lastBought = id; beep('coin');
        announce('Bought ' + RR.UPGRADE[id].name + '. ' + RR.coinsLeft(S.selected) + ' coins left.'); return render();
      case 'sell':
        S.selected = RR.sell(S.selected, id); beep('tap');
        announce('Removed ' + RR.UPGRADE[id].name + '. You got ' + RR.UPGRADE[id].cost + ' coins back. ' + RR.coinsLeft(S.selected) + ' coins left.'); return render();
      case 'cantbuy':
        if (S.hard) { announce('Insufficient coins for ' + RR.UPGRADE[id].name + '. Keep some coins for service.'); return; }
        var need = RR.canBuy(S.selected, id).need;
        announce('You need ' + need + ' more coin' + (need > 1 ? 's' : '') + ' for ' + RR.UPGRADE[id].name + '. Remove something to free up coins.'); return;
      case 'go-code': return go('code');
      case 'go-budget': return go('budget');
      case 'arm':
        if (S.armed && S.armed.kind === kind && S.armed.id === id) { S.armed = null; announce('Block put back.'); }
        else {
          S.armed = { kind: kind, id: id }; beep('tap');
          announce('Picked ' + (kind === 'if' ? RR.CONDITION[id].label : RR.ACTION[id].label) + '. Now choose ' + (kind === 'if' ? 'an IF' : 'a THEN') + ' space on a rule.');
        }
        return render();
      case 'disarm': S.armed = null; return render();
      case 'zone':
        if (S.armed) {
          if (S.armed.kind === kind) { place(i, kind, S.armed.id); return render(); }
          announce('That is ' + (kind === 'if' ? 'an IF' : 'a THEN') + ' space. Your block goes in ' + (S.armed.kind === 'if' ? 'an IF' : 'a THEN') + ' space.');
          return;
        }
        S.modal = { type: 'picker', i: i, kind: kind, returnK: el.getAttribute('data-k') }; return render();
      case 'pick': place(S.modal.i, S.modal.kind, id); S.modal = null; return render();
      case 'pick-clear':
        if (S.modal.kind === 'if') S.rules[S.modal.i].condition = null; else S.rules[S.modal.i].action = null;
        announce('Block removed.'); S.modal = null; return render();
      case 'clear':
        if (kind === 'if') S.rules[i].condition = null; else S.rules[i].action = null;
        announce('Removed from rule ' + (i + 1) + '.'); return render();
      case 'trash': S.rules[i].condition = null; S.rules[i].action = null; announce('Rule ' + (i + 1) + ' cleared.'); return render();
      case 'up': case 'down':
        var j = act === 'up' ? i - 1 : i + 1;
        if (j < 0 || j >= S.rules.length) return;
        var t = S.rules[i]; S.rules[i] = S.rules[j]; S.rules[j] = t;
        announce('Moved to rule ' + (j + 1) + '.');
        render();
        var f = app.querySelector('[data-k="' + (act === 'up' ? 'up-' : 'dn-') + j + '"]');
        if (f && !f.disabled) f.focus(); else { f = app.querySelector('[data-k="tr-' + j + '"]'); if (f) f.focus(); }
        return;
      case 'hb':
        S.handbook = !S.handbook; render();
        var h = app.querySelector(S.handbook ? '#hb-h' : '[data-k="hb-tab"]'); if (h) h.focus();
        return;
      case 'start-day': return confirmStart();
      case 'next': return next();
      case 'auto':
        S.autoplay = !S.autoplay;
        if (S.autoplay && S.phase === 3) scheduleAuto();
        announce(S.autoplay ? 'Auto play on.' : 'Paused.');
        return render();
      case 'improve': S.day = null; return go('code');
      case 'improve-shop': S.day = null; return go('budget');
      case 'again':
        S.modal = { type: 'confirm', title: 'Play again?', yes: 'Play again', no: 'Stay here', onYes: reset,
          body: S.hard ? '<p>Return to the difficulty choices for a new game.</p>' : '<p>Start with 10 coins, empty rules, and a shuffled customer line.</p>' };
        return render();
      case 'close':
        var back = S.modal && S.modal.returnK; S.modal = null; render();
        if (back) { var b = app.querySelector('[data-k="' + back + '"]'); if (b) b.focus(); }
        return;
      case 'confirm': var fn = S.modal.onYes; S.modal = null; return fn();
    }
  });

  app.addEventListener('input', function (ev) {
    if (ev.target.name === 'nickname') ev.target.setCustomValidity('');
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && S.modal && S.modal.type === 'challenge' && ev.target.name === 'nickname') {
      ev.preventDefault();
      return startChallenge();
    }
    if (ev.key === 'Escape') {
      if (S.modal) { S.modal = null; render(); }
      else if (S.armed) { S.armed = null; render(); announce('Block put back.'); }
      else if (S.handbook) { S.handbook = false; render(); }
      return;
    }
    if (ev.key === 'Tab' && S.modal) {
      var f = app.querySelectorAll('.modal input, .modal button');
      if (!f.length) return;
      var first = f[0], lastB = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); lastB.focus(); }
      else if (!ev.shiftKey && document.activeElement === lastB) { ev.preventDefault(); first.focus(); }
    }
  });

  /* ---------------- drag and drop (pointer) ---------------- */
  var drag = null, dragJustEnded = false, dragScrollFrame = null;
  function dragZoneAt(x, y) {
    var under = document.elementFromPoint(x, y);
    return under && under.closest('.zone');
  }
  function highlightDragZone() {
    var zone = dragZoneAt(drag.clientX, drag.clientY);
    if (zone && zone.getAttribute('data-kind') !== drag.kind) zone = null;
    if (drag.over === zone) return;
    if (drag.over) drag.over.classList.remove('over');
    if (zone) zone.classList.add('over');
    drag.over = zone;
  }
  function scrollDragPage() {
    dragScrollFrame = null;
    if (!drag || !drag.ghost) return;
    var viewportHeight = window.innerHeight;
    var edge = Math.min(110, viewportHeight / 4);
    var y = drag.clientY;
    var speed = y < edge ? -Math.ceil((edge - y) / 5) :
      y > viewportHeight - edge ? Math.ceil((y - viewportHeight + edge) / 5) : 0;
    if (!speed) return;
    var before = window.scrollY;
    window.scrollBy(0, speed);
    if (window.scrollY === before) return;
    highlightDragZone();
    dragScrollFrame = window.requestAnimationFrame(scrollDragPage);
  }
  app.addEventListener('pointerdown', function (ev) {
    var el = ev.target.closest('.palette [data-act="arm"]');
    if (!el || ev.button > 0 || ev.isPrimary === false || drag) return;
    var grip = ev.target.closest('.block-grip');
    drag = {
      el: el, kind: el.getAttribute('data-kind'), id: el.getAttribute('data-id'),
      x: ev.clientX, y: ev.clientY, grip: !!grip, ghost: null, over: null, pid: ev.pointerId
    };
  });
  window.addEventListener('pointermove', function (ev) {
    if (!drag || ev.pointerId !== drag.pid) return;
    if (!drag.ghost) {
      var horizontal = Math.abs(ev.clientX - drag.x);
      var vertical = Math.abs(ev.clientY - drag.y);
      if (horizontal + vertical < (drag.grip ? 4 : 10)) return;
      if (!drag.grip && ev.pointerType === 'touch' && vertical >= horizontal) return;
      drag.ghost = drag.el.cloneNode(true);
      drag.ghost.classList.add('ghost'); drag.ghost.classList.remove('armed');
      document.body.appendChild(drag.ghost);
      document.body.classList.add('dragging');
      app.querySelectorAll('.zone[data-kind="' + drag.kind + '"]').forEach(function (z) { z.classList.add('target'); });
    }
    ev.preventDefault();
    drag.clientX = ev.clientX;
    drag.clientY = ev.clientY;
    drag.ghost.style.left = drag.clientX + 'px';
    drag.ghost.style.top = drag.clientY + 'px';
    highlightDragZone();
    if (dragScrollFrame === null) dragScrollFrame = window.requestAnimationFrame(scrollDragPage);
  }, { passive: false });
  function endDrag(ev) {
    if (!drag || (ev && ev.pointerId !== drag.pid)) return;
    var d = drag; drag = null;
    if (!d.ghost) return;
    if (dragScrollFrame !== null) {
      window.cancelAnimationFrame(dragScrollFrame);
      dragScrollFrame = null;
    }
    d.ghost.remove();
    document.body.classList.remove('dragging');
    dragJustEnded = true; setTimeout(function () { dragJustEnded = false; }, 60);
    var z = ev && dragZoneAt(ev.clientX, ev.clientY);
    if (z && ev.type === 'pointerup') {
      if (z.getAttribute('data-kind') === d.kind) place(+z.getAttribute('data-zone'), d.kind, d.id);
      else announce('That block goes in ' + (d.kind === 'if' ? 'an IF' : 'a THEN') + ' space.');
    }
    render();
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  window.addEventListener('blur', function () { endDrag(); });

  /* test hook for automated checks */
  window.__rr = { state: function () { return S; }, render: render,
    resetVisitor: function () { clearTimers(); S = freshState(); render(); },
    startVisitor: function (mode) {
      clearTimers(); S = freshState();
      if (mode === 'starter') return go('budget');
      S.modal = { type: 'challenge', returnK: 'challenge' }; render();
    }
  };
  render();
})();
</script>

  function setHome() {
    stop(); cancelDrag();
    state=fresh(false);state.screen='home';

    window.__rr.resetVisitor();
    render(true);
  }
  function startDelivery(challenge) { stop(); cancelDrag();state=fresh(challenge);document.body.classList.add('colab-visible');render(true);speak(challenge?'A puddle is in the way. Choose a route.':'Help Pip reach the customer. Choose arrows, then press Go.'); }
  function edited() { state.pos={x:0,y:0};state.step=-1;state.success=false;state.message='Ready to try your arrows?'; }
  function addArrow(key,index) {
    if(state.running)return;
    if(state.program.length>=6){speak('The row is full. Tap an arrow to make room.');return;}
    if(state.challenge && coinsLeft()<1){state.message='All five coins are in use. Return an arrow or the bridge to change your plan.';render();speak(state.message);return;}
    state.program.splice(index===undefined?state.program.length:Math.min(index,state.program.length),0,key);edited();render();speak(directions[key].label+' arrow added.');
  }
  function run() {
    if(state.running || !state.program.length)return;
    stop();var turn=generation;
    state.pos={x:0,y:0};state.step=-1;state.success=false;state.running=true;state.message='Watch Pip follow each arrow.';render();
    function tick() {
      if(turn!==generation)return;
      state.step++;
      if(state.step>=state.program.length){
        state.running=false;state.step=-1;state.success=state.pos.x===2&&state.pos.y===0;
        state.message=state.success?'The snack reached the customer!':'Pip stopped here. What arrow would help Pip reach the customer?';render();speak(state.message);return;
      }

  }

  function buildPrint() {

  }
